## Settings file was created by plugin Saiyaheim v0.1.0
## Plugin GUID: com.hman.saiyaheim

[1 - General]

## Key that toggles ki on and off. Ki turned off behaves like zero ki: no damage bonus, no mastery accumulating, no ki term in the power level.
# Setting type: KeyboardShortcut
# Default value: K
ToggleKiKey = K

## Starting ki state on a brand new character.
# Setting type: Boolean
# Default value: true
KiEnabledByDefault = true

## Key HELD DOWN to actively charge ki, far faster than passive regeneration.
# Setting type: KeyboardShortcut
# Default value: R
ChargeKiKey = R

## Key that takes off and lands. Once airborne, movement is the usual one: the game's Jump button climbs, Crouch descends and Run flies fast.
# Setting type: KeyboardShortcut
# Default value: V
ToggleFlightKey = V

[2 - Ki]

## Maximum ki at level 0 of the Battle Power skill. The cap grows from here — see MaxKiPerPowerLevel. With a fixed cap the bar would be the same size from the first boss to the last and progression would never show up on the HUD. (Playtest value, 2026-07-31. Still being tuned.)
# Setting type: Single
# Default value: 50
# Acceptable value range: From 10 to 10000
MaxKi = 50

## Maximum ki added per level of Battle Power. With the default, level 100 quadruples the bar (100 base + 300).
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 100
MaxKiPerPowerLevel = 3

## Ki regenerated per second while idle. Deliberately low: passive regeneration is the safety net, not the normal way to get ki back. If you want ki, you charge for it. (Calibrated in the 2026-07-28 playtest.)
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 500
KiRegenPerSecond = 0.5

## Ki tick interval in seconds (regeneration and drain). A smaller value reads smoother and costs more CPU.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0.05 to 1
KiTickInterval = 0.25

## Seconds without regenerating after spending ki. Deliberately long, together with a low KiRegenPerSecond: spending ki should hurt, and recovering it should be an action. (Calibrated in the 2026-07-28 playtest.)
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 10
KiRegenDelay = 5

## Ki per second while the charge key is held. Should be much higher than KiRegenPerSecond — the point is that charging is a deliberate action worth taking, not just waiting faster. Deliberately ignores KiRegenDelay. (Playtest value, 2026-07-31. Still being tuned.)
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 500
ChargeKiPerSecond = 5

## If true, moving interrupts charging. Charging while standing still is the classic Dragon Ball gesture and creates a real choice: stopping to charge leaves you exposed. (Both tested in the 2026-07-28 playtest; standing still won.)
# Setting type: Boolean
# Default value: true
ChargeRequiresStandingStill = true

[2.1 - Combat]

## Ki consumed per unarmed hit while ki is on. Insufficient ki does NOT cancel the hit — the punch lands with raw vanilla damage, without the power level bonus. Set to zero to disable the cost. Missing costs nothing (the charge happens on the hit, not on the swing). (Playtest value, 2026-07-31. Still being tuned.)
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 100
PunchKiCost = 5

## Fraction of the power level ADDED to punch damage. Additive, not multiplicative: enemy HP grows roughly linearly across biomes, and an additive stat scales predictably against that. (Playtest value, 2026-07-31. Still being tuned.)
# Setting type: Single
# Default value: 0.15
# Acceptable value range: From 0 to 10
PunchDamageFromPower = 0.15

## Armor guaranteed while ki is on, before the share that comes from power. It exists so the player does not end up MORE fragile by turning ki on early in the game, when the skill is still at a low level. (Playtest value, 2026-07-31. Still being tuned.)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 200
ArmorBase = 1

## Fraction of the power level converted into armor. While ki is on this armor REPLACES equipment armor — worn pieces stop counting. Turning ki off gives vanilla armor back immediately.
# Setting type: Single
# Default value: 0.15
# Acceptable value range: From 0 to 10
ArmorFromPower = 0.15

[3 - Transformations]

## One-off ki cost to activate a transformation.
# Setting type: Single
# Default value: 20
# Acceptable value range: From 0 to 1000
ActivationCost = 20

## Base ki drain per second, before the mastery reduction.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 100
DrainPerSecond = 5

[4 - Mastery]

## Fraction of the drain removed at level 100. Formula: drain = base * (1 - level/100 * this_value). 0.8 = at level 100 the drain falls to 20% of the base. Careful: too high a value makes the form practically permanent and ki stops being a source of tension.
# Setting type: Single
# Default value: 0.8
# Acceptable value range: From 0 to 0.95
DrainReductionAtMaxLevel = 0.8

## XP for the form's skill per ki tick while transformed. The diminishing gain curve up to level 100 is Valheim's own.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0 to 10
XpPerTick = 0.25

[5 - Flight]

## Ki per second while flying. Deliberately high: flight should be a tool, not the default way to get around — otherwise the game's hostile terrain turns into scenery. Running out of ki in the air drops you.
# Setting type: Single
# Default value: 15
# Acceptable value range: From 0 to 100
KiPerSecond = 15

## Ki cost multiplier while the Run button is held. Higher than the speed multiplier on purpose: fast flight should cost more per travelled metre, not just more per second.
# Setting type: Single
# Default value: 2.5
# Acceptable value range: From 1 to 10
FastKiMultiplier = 2.5

## Flight speed floor: skill 0, power level 0, carrying nothing. Everything else is added or multiplied on top of this. (Lowered from 15 after the 2026-07-31 playtest, to leave room below MaxSpeed for the progression to actually show.)
# Setting type: Single
# Default value: 10
# Acceptable value range: From 1 to 100
BaseSpeed = 2

## Speed ADDED per point of raw power level. With ki on, power is k1*HP + k4*BattlePower — so eating better and fighting more both make you fly faster, which is the Dragon Ball reading of getting stronger. Additive, like punch damage: enemy scaling is roughly linear across biomes and an additive stat tracks that predictably. Run saiya_fly to see how much this is contributing right now.
# Setting type: Single
# Default value: 0.015
# Acceptable value range: From 0 to 1
SpeedFromPower = 0.015

## Speed multiplier while the Run button is held. Vanilla already reads that button inside its own flight code, so fast flight costs no extra keybind.
# Setting type: Single
# Default value: 1.8
# Acceptable value range: From 1 to 10
FastSpeedMultiplier = 1.8

## Climb and dive speed, as a fraction of the horizontal speed. 1.0 goes up as fast as forward, which makes altitude nearly free. (Lowered from 0.75 after the 2026-07-31 playtest: climbing felt too quick.)
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 2
VerticalSpeedFactor = 0.5

## Turn speed in the air. The vanilla value is 12; lower feels heavier and makes high speed harder to steer.
# Setting type: Single
# Default value: 12
# Acceptable value range: From 1 to 50
TurnSpeed = 12

## Speed bonus at level 100 of the flight skill. 0.5 = +50%.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 3
SpeedSkillBonus = 0.5

## Fraction of the ki cost removed at level 100 of the flight skill. 0.5 = at max level flying costs half. Together with SpeedSkillBonus this is the whole progression of the skill: farther per point of ki.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 0.95
KiSkillReduction = 0.5

## Flight skill XP per second airborne. Flying is its own training — there is no other way to raise it. Valheim's own diminishing curve up to 100 applies.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 20
XpPerSecond = 0.3

## Fraction of the speed lost with the inventory at maximum weight. 0.5 = flying fully loaded you go at half speed.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 0.95
WeightPenalty = 0.5

## Minimum Battle Power level required to take off. 0 disables the gate. A placeholder for the boss gating of step 7 — until that decision is made, this is the only lock available on flight.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 100
MinBattlePower = 0

## Hard speed cap, applied after every multiplier. An engine limit, not balance: above a certain speed zone streaming cannot keep up and the world loads in chunks.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 5 to 100
MaxSpeed = 30

## Touching the ground ends the flight by itself, so you do not walk around still burning ki. Only after you have actually left the ground once — otherwise taking off would land you on the same frame.
# Setting type: Boolean
# Default value: true
AutoLandOnGround = true

## Forces the standing idle pose while flying, which is the Dragon Ball look. The vanilla player animator has no flight state, so without this you fly in the free-fall pose. Purely visual — turn it off if it breaks some animation. (Confirmed working in the 2026-07-31 playtest.)
# Setting type: Boolean
# Default value: true
ForceIdlePose = true

[6 - Power Level]

## Weight of HP in the power level. Applies to both formulas. Only HP ABOVE the game's minimum (25) counts: those 25 are handed to any new character for free, and counting them would give everyone a floor of power nobody earned. (Fixed in the 2026-07-30 playtest.)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 100
K1_Health = 1

## Weight of the equipped weapon's damage. Only used in the ki-OFF formula.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 100
K2_WeaponDamage = 2

## Weight of equipment armor. Only used in the ki-OFF formula — with ki on, armor is an output of the power level, not an input.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0 to 100
K3_Armor = 1.5

## Weight of the Battle Power skill level (0-100). Only used in the ki-ON formula. It is the only axis of progression for a ki user — without it, power would be constant from the first boss to the last.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 1000
K4_PowerSkill = 3

## Exponent of the compression applied to the raw power level before display. 0.5 = square root, 1.0 = no compression. It exists so the number does not become huge and meaningless too early.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0.1 to 1
CompressionExponent = 0.5

## Multiplier applied after the compression, purely for readability.
# Setting type: Single
# Default value: 100
# Acceptable value range: From 1 to 10000
DisplayScale = 100

[6.1 - Battle Power]

## XP per point of damage dealt, CAPPED at the target's remaining HP. That cap is what kills weak-mob farming: a 5000 damage punch on a 10 HP boar counts as 10. (Playtest value, 2026-07-31. Still being tuned.)
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0 to 10
XpPerDamageDealt = 0.05

## XP per point of damage taken, measured AFTER armor. Measuring it after armor is what kills the exploit of taking hits on purpose from a weak enemy: taking little damage pays little.
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0 to 10
XpPerDamageTaken = 0.05

## Extra XP with the inventory at maximum weight. 1.0 = doubles the gain. This is Goku's weighted clothing, and it is self-limiting: weight slows you down, eats stamina and lowers flight speed. The player pays mobility for progression.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 10
XpWeightBonus = 1

## Safety clamp: maximum XP from a single hit, dealt or taken. Prevents one hit on a boss from jumping several levels at once.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0.1 to 1000
XpMaxPerEvent = 5

[7 - HUD]

## Show the ki bar.
# Setting type: Boolean
# Default value: true
ShowKiBar = true

## Horizontal offset of the ki bar, in pixels. Applies live: edit the file with the game running and the bar moves.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -500 to 500
KiBarOffsetX = 0

## Vertical offset of the ki bar, in pixels, relative to the position of the native bars. Negative moves down. Applies live. Do not raise this much: at -30 the ki bar lands on top of the stamina bar. (Playtest value, 2026-07-31.)
# Setting type: Single
# Default value: -50
# Acceptable value range: From -500 to 500
KiBarOffsetY = -50

## Ki bar color, #RRGGBB format. Applies when the config reloads.
# Setting type: String
# Default value: #4FC3F7
KiBarColor = #4FC3F7

## If true, the ki bar stays on screen at all times. If false (default), it hides when ki is full and comes back when you spend, just like the native stamina and eitr bars. With ki turned OFF the bar hides in both cases.
# Setting type: Boolean
# Default value: false
KiBarAlwaysVisible = false

[8 - Effects]

## Emote looped while charging ki. Empty disables the animation. Run saiya_dumpemotes in the console (F5) to see the valid list — the ones of type Bool are the ones that loop.
# Setting type: String
# Default value: roar
ChargeEmote = roar

## Visual effect prefab attached to the player while charging. Empty disables it. Run saiya_dumpprefabs for the full list; candidates include fx_ShieldCharge_1 through _5 (increasing intensity) and fx_chainlightning_spread.
# Setting type: String
# Default value: fx_DvergerMage_Support_start
ChargeEffectPrefab = fx_DvergerMage_Support_start

## Sound prefab looped while charging. Empty disables it. Alternatives: sfx_StaffLightning_charge, sfx_staff_lightning_charge.
# Setting type: String
# Default value: sfx_charred_mage_attack_charge
ChargeSoundPrefab = sfx_charred_mage_attack_charge

## Charging effect color, #RRGGBB format. Empty keeps the prefab's original color. Applies on the next charge — no restart needed. The original particle fade is preserved; only the base color changes.
# Setting type: String
# Default value: #4FC3F7
ChargeEffectColor = #4FC3F7

## Scale of the visual effect. The Dverger support effect is born far too small at player scale and needs to be doubled. (Calibrated in the 2026-07-28 playtest.)
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0.1 to 5
ChargeEffectScale = 2

## Forces the effect's particles and audio to repeat. Game prefabs are built for a quick burst; without this the effect disappears on its own after a second. Turn it off if some prefab looks wrong when repeating.
# Setting type: Boolean
# Default value: true
ChargeEffectForceLoop = true

[9 - Debug]

## Detailed logging in the BepInEx console.
# Setting type: Boolean
# Default value: false
VerboseLogging = true

