## Settings file was created by plugin Saiyaheim v0.1.0
## Plugin GUID: com.hman.saiyaheim

[1 - General]

## Key that toggles ki on and off. Ki turned off behaves like zero ki: no damage bonus, no mastery accumulating, no ki term in the power level.
# Setting type: KeyboardShortcut
# Default value: K
ToggleKiKey = K

## Starting ki state on a brand new character.
# Setting type: Boolean
# Default value: true
KiEnabledByDefault = true

## Key HELD DOWN to actively charge ki, far faster than passive regeneration.
# Setting type: KeyboardShortcut
# Default value: R
ChargeKiKey = R

## Key that takes off and lands. Once airborne, movement is the usual one: the game's Jump button climbs, Crouch descends and Run flies fast.
# Setting type: KeyboardShortcut
# Default value: G
ToggleFlightKey = G

## Tapping the Jump button twice quickly takes off, on the ground or mid-air. It only takes OFF, never lands: Jump is what climbs while flying, so a double tap up there would fight the control you are already using. ToggleFlightKey and touching the ground are what land you.
# Setting type: Boolean
# Default value: true
TakeOffOnDoubleJump = true

## Maximum seconds between the two taps. Too high and normal jump spamming launches you by accident; too low and the double tap stops registering.
# Setting type: Single
# Default value: 0.35
# Acceptable value range: From 0.05 to 1
DoubleJumpWindow = 0.35

[2 - Ki]

## Maximum ki at level 0 of the Battle Power skill. The cap grows from here — see MaxKiPerPowerLevel. With a fixed cap the bar would be the same size from the first boss to the last and progression would never show up on the HUD. (Playtest value, 2026-07-31. Still being tuned.)
# Setting type: Single
# Default value: 50
# Acceptable value range: From 10 to 10000
MaxKi = 50

## Maximum ki added per level of Battle Power. With the default, level 100 quadruples the bar (100 base + 300).
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 100
MaxKiPerPowerLevel = 3

## Ki regenerated per second while idle. Deliberately low: passive regeneration is the safety net, not the normal way to get ki back. If you want ki, you charge for it. (Calibrated in the 2026-07-28 playtest at 0.5; raised to 1 on 2026-08-01, when taking damage started costing ki and the safety net had to hold more.)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 500
KiRegenPerSecond = 1

## Ki per second ADDED to the passive regeneration for each point of raw power level. Exists because the bar grows with power (MaxKiPerPowerLevel) and a flat tap does not: without this, the stronger the character the SLOWER he fills his own bar, which is the opposite of the intent. The default keeps seconds-to-fill roughly flat across the whole game instead of making the strong player faster — the conservative half of the fix. Check it with saiya_ki, which prints seconds to fill.
# Setting type: Single
# Default value: 0.0075
# Acceptable value range: From 0 to 5
KiRegenFromPower = 0.0075

## Ki tick interval in seconds (regeneration and drain). A smaller value reads smoother and costs more CPU.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0.05 to 1
KiTickInterval = 0.25

## Seconds without regenerating after spending ki. Deliberately long, together with a low KiRegenPerSecond: spending ki should hurt, and recovering it should be an action. (Calibrated in the 2026-07-28 playtest.)
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 10
KiRegenDelay = 5

## Ki per second while the charge key is held. Should be much higher than KiRegenPerSecond — the point is that charging is a deliberate action worth taking, not just waiting faster. Deliberately ignores KiRegenDelay. (Playtest value, 2026-07-31. Still being tuned.)
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 500
ChargeKiPerSecond = 5

## Ki per second ADDED to active charging for each point of raw power level. Same reason as KiRegenFromPower: with a flat 5/s, filling the bar goes from 10 seconds early on to over a minute late, because only the cap grows. The number that matters when tuning this is NOT ki per second, it is seconds-to-fill — read it off saiya_ki at a low and a high skill level.
# Setting type: Single
# Default value: 0.075
# Acceptable value range: From 0 to 5
ChargeKiFromPower = 0.075

## If true, moving interrupts charging. Charging while standing still is the classic Dragon Ball gesture and creates a real choice: stopping to charge leaves you exposed. (Both tested in the 2026-07-28 playtest; standing still won.)
# Setting type: Boolean
# Default value: true
ChargeRequiresStandingStill = true

[2.1 - Combat]

## Ki consumed per point of damage the power level ADDED to the punch — the mirror of DamageTakenKiCost, which charges per point the ki armor absorbed. Both measure the service ki rendered, so the cost scales with the payoff instead of aging into irrelevance. The cost is therefore PunchDamageFromPower * power level * this, and the vanilla unarmed base damage is free — ki did not provide it. Insufficient ki does NOT cancel the hit: the punch lands with raw vanilla damage, without the bonus. Missing costs nothing (the charge happens on the hit, not on the swing). Set to zero to disable the cost. (Starts at 1 to match DamageTakenKiCost — first playtest is 2026-08-01.)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 100
PunchKiCostPerDamage = 3

## Fraction of the power level ADDED to punch damage. Additive, not multiplicative: enemy HP grows roughly linearly across biomes, and an additive stat scales predictably against that. (Playtest value, 2026-08-01. Cut to a third of the 0.15 used on 2026-07-31 — the punch was outscaling the biomes.)
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0 to 10
PunchDamageFromPower = 0.05

## Armor guaranteed while ki is on, before the share that comes from power. It exists so the player does not end up MORE fragile by turning ki on early in the game, when the skill is still at a low level. (Playtest value, 2026-07-31. Still being tuned.)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 200
ArmorBase = 1

## Fraction of the power level converted into armor. While ki is on this armor REPLACES equipment armor — worn pieces stop counting. Turning ki off gives vanilla armor back immediately.
# Setting type: Single
# Default value: 0.06
# Acceptable value range: From 0 to 10
ArmorFromPower = 0.06

## Fraction of the ki armor that survives when the ki bar hits ZERO (the toggle is still on, the bar is just empty). At 0 an empty bar means no armor at all, since ki armor replaces equipment armor. Raise it if running out of ki mid fight turns into an unrecoverable death. It is a cliff, not a fade: armor is at full value down to the last point of ki and only drops at zero. Deliberate — ki swings hard during a fight (punches, flight), and losing armor for ATTACKING would punish the player for something that has nothing to do with being hit.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
ArmorFractionWithoutKi = 0

## Ki consumed per point of damage the ki armor ABSORBED. Taking a hit costs ki the same way landing one does — the ki armor is sustained, not free. Damage that armor does not touch (poison, fall, drowning) absorbs nothing and therefore costs nothing. Set to zero to disable. Note the cost per hit is naturally capped near your armor value: armor can never absorb more than it is worth, so a huge hit does not drain the bar. (Playtest value, 2026-08-01. The conservative 0.15 it shipped with the same day was barely noticeable; at 1 a blocked point of damage costs a point of ki.)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 5
DamageTakenKiCost = 1

## Block power guaranteed while ki is on, before the share that comes from power. The 2 is the vanilla unarmed value, kept as a floor so turning ki on at power level zero never makes blocking WORSE than vanilla. Same role ArmorBase plays for armor, with one difference: unlike armor, this SURVIVES an empty ki bar (ArmorFractionWithoutKi only scales the power-derived share). Zero armor is a legal value; zero block power is a division by zero inside Humanoid.BlockAttack that turns your stamina into NaN permanently. Leave this above zero.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 200
BlockPowerBase = 2

## Fraction of the power level converted into block power. While ki is on this REPLACES the blocker item's value — holding a shield changes nothing, exactly like ArmorFromPower replaces equipment armor. Turning ki off gives the shield back immediately. Calibrated to sit BELOW the vanilla shield ladder: at power skill 10 it lands under the wood shield, at 100 around the serpentscale, never near flametal. Run 'saiya_block shields' for the table and 'saiya_block <damage>' to see what a given hit does. (Starting value, 2026-08-01. Not playtested yet.)
# Setting type: Single
# Default value: 0.22
# Acceptable value range: From 0 to 10
BlockPowerFromPower = 0.22

## Ki consumed per point of damage the ki BLOCK stopped, measured (not estimated) from the hit before and after Humanoid.BlockAttack. Same rule as the armor: if it stopped damage, it costs ki. A failed block stops nothing and costs nothing. Unlike the punch, an empty bar does not cancel anything — the block already happened when the charge lands, so it drains what is there, like the armor does. This is the most expensive thing in the mod by design: blocking stops far more damage than armor absorbs, so it should be a burst, not a stance. Lower it if holding block for two hits empties the bar. Set to zero to make blocking free. (Starting value, 2026-08-01. Not playtested yet.)
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 5
BlockKiCost = 0.5

[3 - Transformations]

## One-off ki cost to activate a transformation.
# Setting type: Single
# Default value: 20
# Acceptable value range: From 0 to 1000
ActivationCost = 20

## Base ki drain per second, before the mastery reduction.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 100
DrainPerSecond = 5

[4 - Mastery]

## Fraction of the drain removed at level 100. Formula: drain = base * (1 - level/100 * this_value). 0.8 = at level 100 the drain falls to 20% of the base. Careful: too high a value makes the form practically permanent and ki stops being a source of tension.
# Setting type: Single
# Default value: 0.8
# Acceptable value range: From 0 to 0.95
DrainReductionAtMaxLevel = 0.8

## XP for the form's skill per ki tick while transformed. The diminishing gain curve up to level 100 is Valheim's own.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0 to 10
XpPerTick = 0.25

[5 - Flight]

## Ki per second while flying. Deliberately high: flight should be a tool, not the default way to get around — otherwise the game's hostile terrain turns into scenery. Running out of ki in the air drops you. (Playtest value, 2026-07-31. Raised from 4: at that cost flight was cheap enough to become the default way to travel.)
# Setting type: Single
# Default value: 10
# Acceptable value range: From 0 to 100
KiPerSecond = 10

## Ki cost multiplier while the Run button is held. Higher than the speed multiplier on purpose: fast flight should cost more per travelled metre, not just more per second.
# Setting type: Single
# Default value: 2.5
# Acceptable value range: From 1 to 10
FastKiMultiplier = 2.5

## Flight speed floor: skill 0, power level 0, carrying nothing. Everything else is added or multiplied on top of this. CAREFUL: the flight skill bonus MULTIPLIES this floor, so lowering it also shrinks what levelling the skill is worth — at 2, a hundred levels of Flight buy +1 m/s on a fresh character. That is intended here: almost all of the speed is meant to come from SpeedFromPower. (Playtest value, 2026-07-31. Started at 15, went to 10, landed on 2.)
# Setting type: Single
# Default value: 2
# Acceptable value range: From 1 to 100
BaseSpeed = 2

## Speed ADDED per point of raw power level. With ki on, power is k1*HP + k4*BattlePower — so eating better and fighting more both make you fly faster, which is the Dragon Ball reading of getting stronger. Additive, like punch damage: enemy scaling is roughly linear across biomes and an additive stat tracks that predictably. Run saiya_fly to see how much this is contributing right now.
# Setting type: Single
# Default value: 0.015
# Acceptable value range: From 0 to 1
SpeedFromPower = 0.015

## Speed multiplier while the Run button is held. Vanilla already reads that button inside its own flight code, so fast flight costs no extra keybind.
# Setting type: Single
# Default value: 1.8
# Acceptable value range: From 1 to 10
FastSpeedMultiplier = 1.8

## Climb and dive speed, as a fraction of the horizontal speed. 1.0 goes up as fast as forward, which makes altitude nearly free. (Lowered from 0.75 after the 2026-07-31 playtest: climbing felt too quick.)
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 2
VerticalSpeedFactor = 0.5

## Turn speed in the air, in degrees per second. Goes straight into m_flyTurnSpeed. The vanilla value is 12, which is a flying-creature number: at 12 a 180-degree turn takes fifteen seconds, and the 2026-07-31 playtest reported exactly that. 200 turns around in about a second. Lower feels heavier and makes high speed harder to steer.
# Setting type: Single
# Default value: 200
# Acceptable value range: From 1 to 720
TurnSpeed = 200

## Speed bonus at level 100 of the flight skill. 0.5 = +50%.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 3
SpeedSkillBonus = 0.5

## Fraction of the ki cost removed at level 100 of the flight skill. 0.5 = at max level flying costs half. Together with SpeedSkillBonus this is the whole progression of the skill: farther per point of ki.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 0.95
KiSkillReduction = 0.5

## Flight skill XP per second airborne. Flying is its own training — there is no other way to raise it. Valheim's own diminishing curve up to 100 applies. (Playtest value, 2026-07-31. Lowered from 1: the skill is what makes flight cheap, and reaching that quickly would undo the cost of KiPerSecond.)
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From 0 to 20
XpPerSecond = 0.3

## Fraction of the speed lost with the inventory at maximum weight. 0.5 = flying fully loaded you go at half speed.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 0.95
WeightPenalty = 0.5

## Minimum Battle Power level required to take off. 0 disables the gate. A placeholder for the boss gating of step 7 — until that decision is made, this is the only lock available on flight.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 100
MinBattlePower = 0

## Hard speed cap, applied after every multiplier. An engine limit, not balance: above a certain speed zone streaming cannot keep up and the world loads in chunks.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 5 to 100
MaxSpeed = 30

## Touching the ground ends the flight by itself, so you do not walk around still burning ki. Only after you have actually left the ground once — otherwise taking off would land you on the same frame.
# Setting type: Boolean
# Default value: true
AutoLandOnGround = true

## Keeps the body horizontal while flying, turning only left and right. The game aims flight rotation at the full movement direction, and the mod puts the climb/dive input into that same vector — so without this, going up flips you belly-up and going down flips you belly-down. The deliberate belly-down lean at speed is a separate, purely visual setting (FastPitch in 5.1) that does not tilt aim or collision.
# Setting type: Boolean
# Default value: true
LevelBody = true

## Forces the standing idle pose while flying, which is the Dragon Ball look. The vanilla player animator has no flight state, so without this you fly in the free-fall pose. Purely visual — turn it off if it breaks some animation. (Confirmed working in the 2026-07-31 playtest.)
# Setting type: Boolean
# Default value: true
ForceIdlePose = true

FallingPoseOnDescend = true

FallingPoseMinDescent = 1

FallingPoseMaxHorizontal = 1.5

[5.1 - Flight Pose]

## Procedural flight pose. Sits on top of the forced idle pose: arms out, legs together, toes pointed, leaning forward as you pick up speed. Turn it off to fly in the plain idle pose.
# Setting type: Boolean
# Default value: true
Enabled = true

## Lower spine front-back while hovering. This is the joint the 2026-07-31 playtest saw moving the legs: on Valheim's rig the lower spine drags the pelvis with it. Keep it small and put the lean in HoverChest.
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From -1 to 1
HoverSpine = 0.3

## Chest front-back while hovering. Bends the upper torso without dragging the hips, so this is usually the one you want.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -1 to 1
HoverChest = 0

## Arms down-up while hovering. This is an absolute target, not an offset: 0 is the T-pose, arms straight out sideways, and hanging at the sides is around -0.65. So -0.45 lifts them a little away from the body.
# Setting type: Single
# Default value: -0.45
# Acceptable value range: From -1 to 1
HoverArmSpread = -0.45

## Arms front-back while hovering. 0 is the T-pose plane, positive is forward.
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From -1 to 1
HoverArmSwing = 0.05

## Lower spine front-back at cruising speed. Fades back out as you speed up into the run range, where FastPitch takes over — the two together would fold the character in half, which is what the 2026-07-31 playtest reported.
# Setting type: Single
# Default value: 0.15
# Acceptable value range: From -1 to 1
ForwardSpine = 0.15

## Chest front-back at cruising speed. The main forward lean of slow flight. (Scaled down from the 0.7 of the 2026-07-31 playtest: that value was compensating for a blend that only ever reached ~55% at cruising speed, and the blend was fixed.) Also fades out as FastPitch comes in.
# Setting type: Single
# Default value: 0.4
# Acceptable value range: From -1 to 1
ForwardChest = 0.4

## Degrees the whole body tips belly-down once you pass cruising speed into the run range. Rotates the body at the hips rather than bending the spine, so the legs come along instead of trailing behind. Purely visual: aim, collision and flight direction stay horizontal (see LevelBody in section 5). 90 is flat Superman, 0 stays upright, negative tips belly-up.
# Setting type: Single
# Default value: 55
# Acceptable value range: From -90 to 90
FastPitch = 55

## Degrees the whole body tips belly-down at cruising speed — the gentle version of FastPitch. Fades out as FastPitch fades in, so the two never stack.
# Setting type: Single
# Default value: 12
# Acceptable value range: From -90 to 90
CruisePitch = 12

## Degrees the nose lifts when climbing and drops when diving, on top of the cruise and fast lean. Before this existed, the only vertical tilt was an accident — climbing and diving both bleed horizontal speed, which relaxed the forward lean, so both of them tipped the body the same way up. 0 keeps the body flat regardless of climb. Scaled by forward speed, so rising straight up from a standstill keeps you upright instead of pitching back.
# Setting type: Single
# Default value: 25
# Acceptable value range: From -90 to 90
ClimbPitch = 25

## Hands the torso, arms and hip rotation back to the game while you attack, block, dodge or emote, so its animation plays as it does on the ground. Without it the pose overwrites those animations every frame and they come out twisted. The hips have to be part of it: a punch turns them, and free arms on a pinned waist is itself a twist. The legs are held separately — see ActionLegHold. Also covers the ki charging emote.
# Setting type: Boolean
# Default value: true
ReleaseOnAction = true

## How much of the leg pose survives an attack, block or emote, when ReleaseOnAction hands the rest of the body back. 1 keeps the legs flying, which is what stops blocking in mid-air from looking like standing still in mid-air. 0 releases them with everything else — try that if the kick on secondary attack looks wrong, since it is the one animation that does need the legs.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
ActionLegHold = 1

## Seconds to hand the upper body over when an action starts, and to take it back when it ends. Deliberately much quicker than BlendSeconds: a punch is over in a fraction of a second, and a slow hand-off would eat the start of it.
# Setting type: Single
# Default value: 0.12
# Acceptable value range: From 0 to 1
ActionBlendSeconds = 0.12

## Arms down-up at full speed. More negative than hovering: the arms come back in against the body, which is what streamlined looks like.
# Setting type: Single
# Default value: -0.6
# Acceptable value range: From -1 to 1
ForwardArmSpread = -0.6

## Arms front-back at full speed, sweeping them behind the body. (Value from the 2026-07-31 playtest; the sign shipped inverted.)
# Setting type: Single
# Default value: 0.4
# Acceptable value range: From -1 to 1
ForwardArmSwing = 0.4

## Forearm stretch — the elbow bend. (Value from the 2026-07-31 playtest; the sign shipped inverted.)
# Setting type: Single
# Default value: 0.8
# Acceptable value range: From -1 to 1
ElbowBend = 0.8

## Foot up-down. Pointed toes are cheap and sell flight better than almost anything else here. (Value from the 2026-07-31 playtest; the sign shipped inverted.)
# Setting type: Single
# Default value: 0.4
# Acceptable value range: From -1 to 1
ToePoint = 0.4

## Turns the body to face the direction of flight. Valheim's idle pose is not symmetrical — the character stands side-on, with the hips angled and the spine twisted back the other way to compensate. Walking hides it; hovering does not. 1 squares up fully, 0 leaves the vanilla stance. If the character ends up over-rotated the other way, this is the value to lower.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
