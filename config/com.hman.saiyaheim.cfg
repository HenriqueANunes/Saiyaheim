[4 - Runestones]

## Chance that reading a lore runestone teaches a ki attack, when that biome still has one you do not know. Runestones that teach nothing make the next one in the same biome likelier — see RuneFindChanceStep. (Starting value. Not playtested yet.)
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0 to 1
RuneFindChance = 0.25

## Added to RuneFindChance for every runestone in the same biome that taught nothing, so bad luck cannot last forever: at 0.25 + 0.25, the fourth empty stone in a row always teaches. Resets when the biome teaches something. Counted per character and per biome. (Starting value. Not playtested yet.)
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0 to 1
RuneFindChanceStep = 0.25

## In-game days before the same runestone can teach the same character again (one day is 20 real minutes; sleeping skips ahead). Until then, reading it only shows the vanilla text. Long on purpose: short would mean camping next to the stone at your base, and runestones are there to make you explore. (Starting value. Not playtested yet.)
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 30
RuneCooldownDays = 3

[4.1 - Ki Blast]

## Damage of this attack at battle power zero, before the power share below. It is the floor: a fresh character has almost no battle power, and an attack that did nothing at all until the bar filled would read as broken on the very first shot. All of it is one damage type: SLASH for the ki blast and the Kamehameha, PIERCE for the Kienzan. (Starting value. Not playtested yet.)
# Setting type: Single
# Default value: 9
# Acceptable value range: From 0 to 1000
DamageBase = 9

## Share of the COMBAT battle power added to this attack's damage. Same number the punch reads, so the attack keeps up with the fists instead of falling behind, transforming makes it stronger for free, and the late-game term applies to it as well. Careful: this is a RANGED hit with no wind-up, so it should sit below PunchDamageFromPower or there is no reason to ever close distance. (Starting value. Not playtested yet.)
# Setting type: Single
# Default value: 0.036
# Acceptable value range: From 0 to 10
DamageFromPower = 0.036

## Ki spent per projectile, charged when you fire — hit or miss. Charging on impact instead would reward aim and punish fighting anything fast, which is the opposite of what a ranged attack should teach. On a charged attack (ChargeTime above 0) this is spent WHILE THE CHARGE GROWS, as it produces each projectile, and letting go costs nothing. A full charge stops costing, however long the key is held after that: what is paid for is projectiles, and at the top there are no more coming. The rate per second is this times BeamCount divided by ChargeTime — saiya_blast prints it. FLAT on purpose, unlike the punch, which costs per point of damage: this is the starting shape and it is expected to get cheap late, when the bar has grown and this number has not. Watch it with saiya_blast, which prints shots per full bar.
# Setting type: Single
# Default value: 20
# Acceptable value range: From 0 to 1000
KiCost = 20

## Seconds before this attack can be fired again. Without it the rate of fire is limited only by the frame rate and by the bar, which turns the attack into a machine gun and makes KiCost the only thing standing between the player and emptying the bar in one second.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 30
Cooldown = 0.5

## Push applied to whatever is hit. It is what makes the shot read as an impact rather than a scratch, and it buys back the distance the attack exists to keep.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 0 to 500
Knockback = 30

## Radius in meters of the explosion where the projectile lands. Everything inside takes the FULL damage and knockback — the game has no falloff — including buildings. Hitting the ground explodes too, so a near miss still hits whoever is close. The shooter is never hit; other players only with PvP on. 0 = only the target struck, as before. On a beam (BeamCount above 1) this applies to every projectile of it.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 20
ImpactRadius = 2

## How many projectiles one press fires. 1 is a single shot. Higher turns the attack into a stream: fired close enough together, a line of projectiles reads as one continuous beam, which is exactly how the game itself draws Yagluth's beam. Damage, ki cost and knockback below are PER PROJECTILE, so this multiplies all three — saiya_blast prints the totals. Raise it for a longer beam, and lower BeamInterval to close the gaps.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 1 to 60
BeamCount = 1

## Seconds between one projectile of a beam and the next. It sets both how long the beam lasts (BeamCount x this) and how far apart the projectiles sit in the air (ProjectileSpeed x this) — and that spacing is what decides whether the eye reads a beam or a row of pellets. Ignored when BeamCount is 1. Aim is recomputed for every projectile, so a long beam follows the crosshair instead of pointing where it started.
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0.01 to 1
BeamInterval = 0.05

## Battle power multiplier this attack uses against trees, rocks and ore. It raises ONLY the tier the attack reaches (at 1.2, a character at 1000 power breaks what needs 1200). Damage there uses your real power, through the same formula as the punch (ChopDamage and PickaxeDamage in the Environment section, times your power over the target's tier threshold), so a tier reached only thanks to this is chipped slowly. That damage is then weighted by how many punches one projectile is worth against an enemy, so a beam of weak projectiles stays weak on trees too. It does NOT touch damage against enemies. Applies per projectile: a beam hits once per projectile, and every tree inside the explosion radius takes the hit. 0 turns off damage to trees, rocks and ore. (Starting value, 2026-09-27. Not playtested yet.)
# Setting type: Single
# Default value: 1.2
# Acceptable value range: From 0 to 10
TierPowerMultiplier = 1.2

## Seconds of holding the fire key to reach a full charge. 0 turns charging off and the attack fires on the key press, with the whole beam at once — which is what the ki blast does. Holding longer fires MORE projectiles, up to BeamCount, and makes them thicker; it does NOT make each projectile hit harder. So the ki spent and the damage dealt both grow with the hold, in a straight line. The ki is spent WHILE THE CHARGE GROWS, not on release: you pay for each projectile the moment the charge produces it, so the bar going down is the charge meter, and it stops going down the instant the charge is full — holding a finished charge is free, because there is nothing left to buy. Running the bar dry fires the attack immediately with whatever was paid for: holding a key that has stopped doing anything would only be found out on release.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 30
ChargeTime = 0

## Smallest fraction of a full charge that still fires, from 0 to 1. Letting go below it drops the charge instead of firing, so brushing the key does not throw a single projectile the player never meant to fire. The ki that fraction of a second already drained does NOT come back — refunding it would mean tracking the spend tick by tick, for a few points of a bar measured in hundreds. It is ignored when the bar runs dry mid-charge: that fires whatever was paid for, however short, because refusing there would charge for nothing. Ignored entirely when ChargeTime is 0.
# Setting type: Single
# Default value: 0.15
# Acceptable value range: From 0 to 1
MinChargeRatio = 0.15

## Projectile speed in metres per second. For reference, a player runs at about 5 and flies at up to 30. Too slow and anything mobile walks out of the way; too fast and there is nothing to see between the hand and the target.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 1 to 200
ProjectileSpeed = 30

## Seconds the projectile lives before vanishing. Range is this times ProjectileSpeed — saiya_blast prints the result in metres. Overrides the prefab's own lifetime.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0.5 to 30
ProjectileLifetime = 3

## Biome whose lore runestones can teach this attack. Each character learns it on their own, by reading a runestone in that biome — friends do not share it. The biome comes from where the stone stands. None takes the attack out of the runestones, and then only the console can teach it.
# Setting type: Biome
# Default value: Meadows
# Acceptable values: None, Meadows, Swamp, Mountain, BlackForest, Plains, AshLands, DeepNorth, Ocean, Mistlands, Land, All
# Multiple values can be set at the same time by separating them with , (e.g. Debug, Warning)
LearnBiome = Meadows

## Weight of this attack in the draw when one runestone could teach more than one attack the character does not know yet. Twice the weight, twice as likely to come first. 0 means runestones never teach it.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 10
LearnWeight = 1

## Global key of a boss that must ALSO be dead before this attack can be used, on top of learning it from a runestone. Empty (the default) disables this gate: runestones alone unlock the attack. The key belongs to the WORLD, so the server syncs it for free and someone joining later arrives with whatever the group has already killed.
## The five valid keys, and mind that two are NOT named after the boss: defeated_eikthyr (Eikthyr), defeated_gdking (The Elder), defeated_bonemass (Bonemass), defeated_dragon (MODER), defeated_goblinking (YAGLUTH). A key that does not exist is not an error — it is an attack that never unlocks. Check it with saiya_blast.
# Setting type: String
# Default value: 
RequiredGlobalKey = 

EnvironmentFactor = 1

