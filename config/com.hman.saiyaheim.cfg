## The five valid keys, and mind that two of them are NOT named after the boss: defeated_eikthyr (Eikthyr), defeated_gdking (The Elder), defeated_bonemass (Bonemass), defeated_dragon (MODER), defeated_goblinking (YAGLUTH). A key that does not exist is not an error — it is a form that never unlocks. Check the current state with saiya_form.
# Setting type: String
# Default value: defeated_gdking
RequiredGlobalKey = defeated_gdking

[3.3 - SSJ3]

## Multiplies the COMBAT battle power while this form is active — punch damage, armor, block power and the number on screen all scale from it, so this one value is the whole strength of the form. Flight speed is multiplied too. The ki cap, ki regeneration and charging deliberately are NOT: a bar that grows on transforming would jump on screen, and scaled regeneration would pay for part of the form's own drain. Note the ki costs of punching and blocking scale WITH it automatically, since both are charged per point of damage dealt or absorbed. (Starting value. Not playtested yet.)
# Setting type: Single
# Default value: 4
# Acceptable value range: From 1 to 50
PowerMultiplier = 4

## Base ki drained per second while transformed, before the mastery reduction. This is the ONLY cost of the form: there is no activation cost. Hitting zero ki powers you down. Flat per second and not a fraction of the bar, because the bar already grows with Power Level (MaxKiPerPowerLevel) — so the form lasts longer as the character grows even before mastery, which is the intended reading of getting stronger. (Starting value. Not playtested yet.)
# Setting type: Single
# Default value: 15
# Acceptable value range: From 0 to 100
KiDrainPerSecond = 15

## Fraction of the punch's BLUNT damage turned into SLASH while this form is active. 0.5 = half and half. The total damage of the hit does not change: this moves damage between types, it does not add any. It applies to the whole punch — vanilla unarmed damage plus the Power Level bonus — and only to unarmed attacks. What it is for: armor is per damage type in Valheim, so a form that hits with two types is less punished by an enemy that resists one of them. Blunt and slash both count toward stagger, so the split does not change how fast a target staggers. (Starting value. Not playtested yet.)
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
PunchSlashFraction = 0

## Fraction of the punch's BLUNT damage turned into LIGHTNING while this form is active. Same rule as PunchSlashFraction above: it MOVES damage between types and adds none, so the total of the hit does not change. The two fractions split the same total. If they add up to more than 1 they are scaled down to fit, rather than eating into the blunt that is not there. Why it matters: lightning is resisted by very few things in Valheim, and the Swamp and Mountains are full of enemies weak to it — but frost caves and Fenring resist it, so it is not a free upgrade over slash. Lightning also counts toward stagger like the other physical types. (Starting value. Not playtested yet.)
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
PunchLightningFraction = 0.5

## Extra carry weight while this form is active. Added on top of the character's own limit (300 in vanilla) and on top of Megingjord, so 300 here would mean double the backpack while transformed. Falls off the moment the form does, and anything you were carrying over the plain limit makes you encumbered again — powering down mid-haul is the cost of using the form as a cart. Side effect worth knowing: carry load is a fraction of the LIMIT, so a bigger limit means the same cargo slows flight less and pays less Power Level XP (XpWeightBonus). Playtested 2026-08-16: started at 300 and came down to 100.
# Setting type: Single
# Default value: 300
# Acceptable value range: From 0 to 2000
CarryWeightBonus = 300

## Fraction of the drain removed at level 100 of THIS form's skill. drain = KiDrainPerSecond * (1 - level/100 * this). 1 = at level 100 the form is FREE: no drain at all, and passive ki regeneration runs again while transformed, so a maxed form is permanent until you drop it yourself. That is the intended end of the mastery curve — at first you barely hold the form, in the end you wear it. Lower it if you want the form to keep costing something forever: 0.8 means level 100 still pays a fifth of the level 0 drain, and ki stays a source of tension all game.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
MasteryDrainReduction = 1

## XP for this form's skill per second transformed. Holding the form is the only way to train it, the same way flying is the only way to train Flight. Valheim's own diminishing curve up to 100 applies on top: reaching level 30 costs about 1600 XP and level 100 about 20000. 
## (Kept at 1 after the 2026-09-06 run, deliberately. That run read SSJ mastery at level 52 with the third boss about to fall, where 80-90 was the target, and raising this key was the obvious fix — it was rejected because it speeds up the whole ladder from the first minute, including the rung the player has just unlocked, which is exactly where the slow climb is supposed to be felt. MasteryXpPerBossBonus below carries the correction instead: the deficit is on the OLD rung and only in the last stretch of play. This key sets the overall pace, that one sets the shape.)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 20
MasteryXpPerSecond = 1

