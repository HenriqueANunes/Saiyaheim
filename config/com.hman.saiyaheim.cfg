[6 - Power Level]

## Weight of HP in the power level. Applies to both formulas. Only HP ABOVE the game's minimum (25) counts: those 25 are handed to any new character for free, and counting them would give everyone a floor of power nobody earned. (Fixed in the 2026-07-30 playtest.)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 100
K1_Health = 1

## Weight of the equipped weapon's damage. Only used in the ki-OFF formula.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 100
K2_WeaponDamage = 2

## Weight of equipment armor. Only used in the ki-OFF formula — with ki on, armor is an output of the power level, not an input.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0 to 100
K3_Armor = 1.5

## Weight of the Battle Power skill level (0-100). Only used in the ki-ON formula. It is the only axis of progression for a ki user — without it, power would be constant from the first boss to the last.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 1000
K4_PowerSkill = 3

## Exponent of the compression applied to the raw power level before display. 0.5 = square root, 1.0 = no compression. It exists so the number does not become huge and meaningless too early.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0.1 to 1
CompressionExponent = 0.5

## Multiplier applied after the compression, purely for readability.
# Setting type: Single
# Default value: 100
# Acceptable value range: From 1 to 10000
DisplayScale = 100

[6.1 - Battle Power]

## XP per point of damage dealt, CAPPED at the target's remaining HP. That cap is what kills weak-mob farming: a 5000 damage punch on a 10 HP boar counts as 10. (Playtest value, 2026-07-31. Still being tuned.)
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0 to 10
XpPerDamageDealt = 0.1

## XP per point of damage taken, measured AFTER armor. Measuring it after armor is what kills the exploit of taking hits on purpose from a weak enemy: taking little damage pays little.
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0 to 10
XpPerDamageTaken = 0.1

## Extra XP with the inventory at maximum weight. 1.0 = doubles the gain. This is Goku's weighted clothing, and it is self-limiting: weight slows you down, eats stamina and lowers flight speed. The player pays mobility for progression.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 10
XpWeightBonus = 1

## Safety clamp: maximum XP from a single hit, dealt or taken. Prevents one hit on a boss from jumping several levels at once.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0.1 to 1000
XpMaxPerEvent = 5

