## Settings file was created by plugin Saiyaheim v0.1.0
## Plugin GUID: com.hman.saiyaheim

[1 - General]

## Key that toggles ki on and off. Ki turned off behaves like zero ki: no damage bonus, no mastery accumulating, no ki term in the power level.
# Setting type: KeyboardShortcut
# Default value: K
ToggleKiKey = K

## Starting ki state on a brand new character.
# Setting type: Boolean
# Default value: true
KiEnabledByDefault = true

## Key HELD DOWN to actively charge ki, far faster than passive regeneration.
# Setting type: KeyboardShortcut
# Default value: R
ChargeKiKey = R

## Key that takes off and lands. Once airborne, movement is the usual one: the game's Jump button climbs, Crouch descends and Run flies fast.
# Setting type: KeyboardShortcut
# Default value: F
ToggleFlightKey = F

## Key that transforms straight into the HIGHEST form you have unlocked, skipping everything below it. Does nothing when you are already there.
# Setting type: KeyboardShortcut
# Default value: T
TransformKey = T

## Key that goes UP one step on the ladder: base form to SSJ, SSJ to SSJ2, and so on. Use it to stop at an intermediate form instead of jumping to the top. Does nothing at the top of what you have unlocked.
# Setting type: KeyboardShortcut
# Default value: T + LeftShift
TransformStepUpKey = T + LeftShift

## Key that drops you straight back to base form, from whatever step you are on — no walking back down the ladder. Running out of ki does the same thing on its own: at zero there is nothing to hold any form with.
# Setting type: KeyboardShortcut
# Default value: G
PowerDownKey = G

## Key that goes DOWN one step, to trade power for a smaller ki drain without leaving the ladder entirely. From the first form it returns to base.
# Setting type: KeyboardShortcut
# Default value: G + LeftShift
TransformStepDownKey = G + LeftShift

## Key that fires the selected ki attack, aimed where you are looking. Needs ki turned on, enough ki for the shot, and the attack unlocked. The ki is spent on the shot, hit or miss.
# Setting type: KeyboardShortcut
# Default value: V
FireKiAttackKey = V

## Key that cycles through the ki attacks you have unlocked. With a single one unlocked it just names it on screen. The selection is not saved: every session starts on the first attack.
# Setting type: KeyboardShortcut
# Default value: V + LeftShift
CycleKiAttackKey = V + LeftShift

## Tapping the Jump button twice quickly takes off, on the ground or mid-air. It only takes OFF, never lands: Jump is what climbs while flying, so a double tap up there would fight the control you are already using. ToggleFlightKey and touching the ground are what land you.
# Setting type: Boolean
# Default value: true
TakeOffOnDoubleJump = true

## Maximum seconds between the two taps. Too high and normal jump spamming launches you by accident; too low and the double tap stops registering.
# Setting type: Single
# Default value: 0.35
# Acceptable value range: From 0.05 to 1
DoubleJumpWindow = 0.35

[2 - Ki]

## Maximum ki at level 0 of the Battle Power skill. The cap grows from here — see MaxKiPerPowerLevel. With a fixed cap the bar would be the same size from the first boss to the last and progression would never show up on the HUD. (Playtest value, 2026-07-31. Still being tuned.)
# Setting type: Single
# Default value: 50
# Acceptable value range: From 10 to 10000
MaxKi = 50

## Maximum ki added per level of Battle Power. With the default, level 100 quadruples the bar (100 base + 300).
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 100
MaxKiPerPowerLevel = 3

## Ki regenerated per second while idle. Deliberately low: passive regeneration is the safety net, not the normal way to get ki back. If you want ki, you charge for it. (Calibrated in the 2026-07-28 playtest at 0.5; raised to 1 on 2026-08-01, when taking damage started costing ki and the safety net had to hold more.)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 500
KiRegenPerSecond = 1

## Ki per second ADDED to the passive regeneration for each point of raw power level. Exists because the bar grows with power (MaxKiPerPowerLevel) and a flat tap does not: without this, the stronger the character the SLOWER he fills his own bar, which is the opposite of the intent. The default keeps seconds-to-fill roughly flat across the whole game instead of making the strong player faster — the conservative half of the fix. Check it with saiya_ki, which prints seconds to fill.
# Setting type: Single
# Default value: 0.0075
# Acceptable value range: From 0 to 5
KiRegenFromPower = 0.0075

## Ki tick interval in seconds (regeneration and drain). A smaller value reads smoother and costs more CPU.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0.05 to 1
KiTickInterval = 0.25

## Seconds without regenerating after spending ki. Deliberately long, together with a low KiRegenPerSecond: spending ki should hurt, and recovering it should be an action. (Calibrated in the 2026-07-28 playtest.)
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 10
KiRegenDelay = 5

## Ki per second while the charge key is held. Should be much higher than KiRegenPerSecond — the point is that charging is a deliberate action worth taking, not just waiting faster. Deliberately ignores KiRegenDelay. (Playtest value, 2026-07-31. Still being tuned.)
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 500
ChargeKiPerSecond = 5

## Ki per second ADDED to active charging for each point of raw power level. Same reason as KiRegenFromPower: with a flat 5/s, filling the bar goes from 10 seconds early on to over a minute late, because only the cap grows. The number that matters when tuning this is NOT ki per second, it is seconds-to-fill — read it off saiya_ki at a low and a high skill level.
# Setting type: Single
# Default value: 0.075
# Acceptable value range: From 0 to 5
ChargeKiFromPower = 0.075

## If true, moving interrupts charging. Charging while standing still is the classic Dragon Ball gesture and creates a real choice: stopping to charge leaves you exposed. (Both tested in the 2026-07-28 playtest; standing still won.)
# Setting type: Boolean
# Default value: true
ChargeRequiresStandingStill = true

[2.1 - Combat]

## Ki consumed per point of damage the power level ADDED to the punch — the mirror of DamageTakenKiCost, which charges per point the ki armor absorbed. Both measure the service ki rendered, so the cost scales with the payoff instead of aging into irrelevance. The cost is therefore PunchDamageFromPower * power level * this, and the vanilla unarmed base damage is free — ki did not provide it. Insufficient ki does NOT cancel the hit: the punch lands with raw vanilla damage, without the bonus. Missing costs nothing (the charge happens on the hit, not on the swing). Set to zero to disable the cost. (Playtest value, 2026-08-01: started at 1 to match DamageTakenKiCost and the punch was nearly free — the bar barely moved in a fight. 3 is what made the cost readable.)
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 100
PunchKiCostPerDamage = 3

## How much the combat power level makes the three COMBAT ki costs cheaper — punching (PunchKiCostPerDamage), taking hits (DamageTakenKiCost) and blocking (BlockKiCost) — as 1 / (1 + this * combat power). 0 disables the discount and the costs stay strictly proportional to what ki delivered. Why it exists: all three costs come from the combat power level, which has no ceiling — the late-game term grows forever and a transformation multiplies it — while the ki bar comes from the Battle Power SKILL level, which stops at 100. Without this, a punch eventually costs more than a full bar and lands with raw vanilla damage, and blocking drains the bar in two hits. 
## The shape matters: each cost approaches its own rate divided by this and never passes it, so actions per bar settles instead of falling to zero. For the punch at 0.01 that ceiling is 15 ki, so a full bar always buys a long fight no matter how far the power level runs. 
## It also fixes transformations without a key of its own: a form multiplies the power, and it is the power that buys the discount, so the ratio of damage per bar between transformed and not approaches the form's PowerMultiplier instead of sitting at 1. 
## One key for all three deliberately: it is the same problem in all of them, and splitting it would invite cheap punches next to expensive blocks with no design question behind the difference. 
## Early game the power is small, so the discount is a few percent and the values calibrated on 2026-08-01 still hold there. (Playtest value, 2026-08-04. Started at 0.002, which was still tight enough that the transformed fight lived on the edge of the bar; 0.01 is what made the combat read as combat instead of bar management.)
# Setting type: Single
# Default value: 0.01
# Acceptable value range: From 0 to 1
KiCostPowerReduction = 0.01

## Fraction of the power level ADDED to punch damage. Additive, not multiplicative: enemy HP grows roughly linearly across biomes, and an additive stat scales predictably against that. (Playtest value, 2026-08-01. Cut to a third of the 0.15 used on 2026-07-31 — the punch was outscaling the biomes.)
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0 to 10
PunchDamageFromPower = 0.05

## Armor guaranteed while ki is on, before the share that comes from power. It exists so the player does not end up MORE fragile by turning ki on early in the game, when the skill is still at a low level. (Playtest value, 2026-07-31. Still being tuned.)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 200
ArmorBase = 1

## Fraction of the power level converted into armor. While ki is on this armor REPLACES equipment armor — worn pieces stop counting. Turning ki off gives vanilla armor back immediately. Reads the COMBAT power level, so it grows with K5_LateGameBonus — that is why this is much lower than it looks like it should be. (Playtest value, 2026-08-01. Lowered from 0.15 when the late-game term doubled power at level 100 and armor came along for the ride.)
# Setting type: Single
# Default value: 0.06
# Acceptable value range: From 0 to 10
ArmorFromPower = 0.06

## Fraction of the ki armor that survives when the ki bar hits ZERO (the toggle is still on, the bar is just empty). At 0 an empty bar means no armor at all, since ki armor replaces equipment armor. Raise it if running out of ki mid fight turns into an unrecoverable death. It is a cliff, not a fade: armor is at full value down to the last point of ki and only drops at zero. Deliberate — ki swings hard during a fight (punches, flight), and losing armor for ATTACKING would punish the player for something that has nothing to do with being hit.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
ArmorFractionWithoutKi = 0

## Ki consumed per point of damage the ki armor ABSORBED. Taking a hit costs ki the same way landing one does — the ki armor is sustained, not free. Damage that armor does not touch (poison, fall, drowning) absorbs nothing and therefore costs nothing. Set to zero to disable. Note the cost per hit is naturally capped near your armor value: armor can never absorb more than it is worth, so a huge hit does not drain the bar. (Playtest value, 2026-08-01. The conservative 0.15 it shipped with the same day was barely noticeable; at 1 a blocked point of damage costs a point of ki.)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 5
DamageTakenKiCost = 1

## Block power guaranteed while ki is on, before the share that comes from power. The 2 is the vanilla unarmed value, kept as a floor so turning ki on at power level zero never makes blocking WORSE than vanilla. Same role ArmorBase plays for armor, with one difference: unlike armor, this SURVIVES an empty ki bar (ArmorFractionWithoutKi only scales the power-derived share). Zero armor is a legal value; zero block power is a division by zero inside Humanoid.BlockAttack that turns your stamina into NaN permanently. Leave this above zero.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 200
BlockPowerBase = 2

## Fraction of the power level converted into block power. While ki is on this REPLACES the blocker item's value — holding a shield changes nothing, exactly like ArmorFromPower replaces equipment armor. Turning ki off gives the shield back immediately. Calibrated to sit BELOW the vanilla shield ladder: at power skill 10 it lands under the wood shield, at 100 around the serpentscale, never near flametal. Run 'saiya_block shields' for the table and 'saiya_block <damage>' to see what a given hit does. (Starting value, 2026-08-01. Not playtested yet.)
# Setting type: Single
# Default value: 0.22
# Acceptable value range: From 0 to 10
BlockPowerFromPower = 0.22

## Ki consumed per point of damage the ki BLOCK stopped, measured (not estimated) from the hit before and after Humanoid.BlockAttack. Same rule as the armor: if it stopped damage, it costs ki. A failed block stops nothing and costs nothing. Unlike the punch, an empty bar does not cancel anything — the block already happened when the charge lands, so it drains what is there, like the armor does. This is the most expensive thing in the mod by design: blocking stops far more damage than armor absorbs, so it should be a burst, not a stance. Lower it if holding block for two hits empties the bar. Set to zero to make blocking free. (Starting value, 2026-08-01. Not playtested yet.)
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 5
BlockKiCost = 0.5

[3.1 - SSJ]

## Multiplies the COMBAT power level while this form is active — punch damage, armor, block power and the number on screen all scale from it, so this one value is the whole strength of the form. Flight speed is multiplied too. The ki cap, ki regeneration and charging deliberately are NOT: a bar that grows on transforming would jump on screen, and scaled regeneration would pay for part of the form's own drain. Note the ki costs of punching and blocking scale WITH it automatically, since both are charged per point of damage dealt or absorbed. (Starting value. Not playtested yet.)
# Setting type: Single
# Default value: 2
# Acceptable value range: From 1 to 50
PowerMultiplier = 2

## Base ki drained per second while transformed, before the mastery reduction. This is the ONLY cost of the form: there is no activation cost. Hitting zero ki powers you down. Flat per second and not a fraction of the bar, because the bar already grows with Battle Power (MaxKiPerPowerLevel) — so the form lasts longer as the character grows even before mastery, which is the intended reading of getting stronger. (Starting value. Not playtested yet.)
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 100
KiDrainPerSecond = 5

## Fraction of the punch's BLUNT damage turned into SLASH while this form is active. 0.5 = half and half. The total damage of the hit does not change: this moves damage between types, it does not add any. It applies to the whole punch — vanilla unarmed damage plus the Battle Power bonus — and only to unarmed attacks. What it is for: armor is per damage type in Valheim, so a form that hits with two types is less punished by an enemy that resists one of them. Blunt and slash both count toward stagger, so the split does not change how fast a target staggers. (Starting value. Not playtested yet.)
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
PunchSlashFraction = 0.5

## Fraction of the drain removed at level 100 of THIS form's skill. drain = KiDrainPerSecond * (1 - level/100 * this). 0.8 = at level 100 the form costs a fifth of what it costs at level 0, which is the whole progression of mastery: at first you barely hold the form, later you own it. Careful: too high and the form becomes permanent and ki stops being a source of tension.
# Setting type: Single
# Default value: 0.8
# Acceptable value range: From 0 to 0.95
MasteryDrainReduction = 0.8

## XP for this form's skill per second transformed. Holding the form is the only way to train it, the same way flying is the only way to train Flight. Valheim's own diminishing curve up to 100 applies on top: reaching level 30 costs about 1600 XP and level 100 about 20000. (Starting value. Not playtested yet.)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 20
MasteryXpPerSecond = 1

## Minimum Battle Power level required to enter this form. 0 disables the gate. This is the TRAINING gate, and it is independent of the boss gate below: with both set, the form needs both. Left at 0 for every form so far, because the ladder is paced by bosses and grinding a skill to reach a form would pace it twice.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 100
MinBattlePower = 0

## Global key of the boss that unlocks this form. Empty disables the gate. The key belongs to the WORLD, not to the character: the server syncs it for free, it survives in the world save, and it counts for everyone in that world — so someone joining later arrives with whatever the group has already killed. That is the intended reading for a world played with friends: the ladder measures the world's progress, not each player's trophy list.
## The five valid keys, and mind that two of them are NOT named after the boss: defeated_eikthyr (Eikthyr), defeated_gdking (The Elder), defeated_bonemass (Bonemass), defeated_dragon (MODER), defeated_goblinking (YAGLUTH). A key that does not exist is not an error — it is a form that never unlocks. Check the current state with saiya_form.
# Setting type: String
# Default value: defeated_eikthyr
RequiredGlobalKey = defeated_eikthyr

## Hair color while this form is active, #RRGGBB format. Empty keeps the character's own color. Applies on the next transformation — no restart needed. The character's real hair color is never overwritten: this only lives for as long as the form does.
# Setting type: String
# Default value: #FFE14A
HairColor = #FFE14A

## Brightness multiplier applied on top of HairColor. Above 1 the color blows out and burns, which is what reads as Super Saiyan hair — a plain hex tops out at #FFFFFF and lands closer to dyed than to glowing. 1 uses the hex as written. (Starting value. Not playtested yet.)
# Setting type: Single
# Default value: 1.6
# Acceptable value range: From 0 to 5
HairColorIntensity = 1.6

## Aura color while this form is active, #RRGGBB format. Empty keeps the prefab's original color. Applies on the next transformation — no restart needed. Defaults to the same color as the hair so the two read as one thing; splitting them is fine if the aura washes out at that tone. This also becomes the color of the ki CHARGING glow while you hold the form, replacing Effects.ChargeEffectColor.
# Setting type: String
# Default value: #FFE14A
AuraColor = #FFE14A

