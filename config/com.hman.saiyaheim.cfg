# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 100
KiDrainPerSecond = 1

## Fraction of the punch's BLUNT damage turned into SLASH while this form is active. 0.5 = half and half. The total damage of the hit does not change: this moves damage between types, it does not add any. It applies to the whole punch — vanilla unarmed damage plus the Power Level bonus — and only to unarmed attacks. What it is for: armor is per damage type in Valheim, so a form that hits with two types is less punished by an enemy that resists one of them. Blunt and slash both count toward stagger, so the split does not change how fast a target staggers. (Starting value. Not playtested yet.)
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
PunchSlashFraction = 0.5

## Fraction of the punch's BLUNT damage turned into LIGHTNING while this form is active. Same rule as PunchSlashFraction above: it MOVES damage between types and adds none, so the total of the hit does not change. The two fractions split the same total. If they add up to more than 1 they are scaled down to fit, rather than eating into the blunt that is not there. Why it matters: lightning is resisted by very few things in Valheim, and the Swamp and Mountains are full of enemies weak to it — but frost caves and Fenring resist it, so it is not a free upgrade over slash. Lightning also counts toward stagger like the other physical types. (Starting value. Not playtested yet.)
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
PunchLightningFraction = 0

## Extra carry weight while this form is active. Added on top of the character's own limit (300 in vanilla) and on top of Megingjord, so 300 here would mean double the backpack while transformed. Falls off the moment the form does, and anything you were carrying over the plain limit makes you encumbered again — powering down mid-haul is the cost of using the form as a cart. Side effect worth knowing: carry load is a fraction of the LIMIT, so a bigger limit means the same cargo slows flight less and pays less Power Level XP (XpWeightBonus). Playtested 2026-08-16: started at 300 and came down to 100.
# Setting type: Single
# Default value: 100
# Acceptable value range: From 0 to 2000
CarryWeightBonus = 100

## How much of the shared combat surcharge (CombatFormKiShare in the Combat section) THIS form charges on punching, blocking, taking hits and ki attacks. 1 = the full surcharge; 0.5 = half of it; 0 = fighting in this form costs the same ki as base form from mastery 0. Mastery still pays off whatever is left. (Starting value. Not playtested yet.)
