# Setting type: Single
# Default value: 40
# Acceptable value range: From 0 to 1000
RatingArmorScale = 40

## Weight of damage PER SECOND in the scannable power rating. Same scale for players and creatures. Per second, not per hit: a troll hits for 70 every ~4 seconds and you punch about once a second, so per-hit made the troll look stronger than a fully maxed player, which the actual fight denies. This is the knob that decides whether the number reads as offence or as bulk. (Playtest value, 2026-09-06. Raised from 1: at parity with the health weight the rating was almost pure bulk, and the number is supposed to answer 'can this thing hurt me', not 'how long does it take to chew through it'.)
