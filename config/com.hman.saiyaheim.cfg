[3 - Transformations]

## Mastery XP per point of damage DEALT while wearing a form. Every form uses the same rate. Fighting inside the form is the only way to train it: holding it while standing still, flying or exploring pays nothing. The damage counted is what the target actually lost, so overkill on a weak creature does not pay, and weapon hits pay by XpWeaponFactor like Power Level does — the form trains the mod's way of fighting. A single hit pays every form up to the active one, each at its own level. This rate and MasteryXpCurveCompensation go together: raising the curve compensation also speeds up the first levels, so the rate has to come down with it. (0.0125 until 2026-09-28, cut to 0.0045 when the curve compensation arrived, so the first levels cost the same as before.)
# Setting type: Single
# Default value: 0.0045
# Acceptable value range: From 0 to 20
MasteryXpPerDamageDealt = 0.0045

## Mastery XP per point of damage TAKEN while wearing a form. Counted after armor and resistances, so taking hits from something weak is worth almost nothing. Same rate as damage dealt by default: holding the form through a beating is training too.
# Setting type: Single
# Default value: 0.0045
# Acceptable value range: From 0 to 20
MasteryXpPerDamageTaken = 0.0045

## Safety clamp: the most mastery XP a single hit can pay, dealt or taken, before the curve compensation and the boss multiplier. Stops one boss-sized hit from jumping several levels at once. At the default rate it only bites above 100 damage in one hit. (Cut from 50 to 25 to 2.5 to 1.25 to 0.45, each time together with the rate, so it still bites at the same damage.)
# Setting type: Single
# Default value: 0.45
# Acceptable value range: From 0.01 to 1000
MasteryXpMaxPerEvent = 0.45

## How much of Valheim's rising XP curve mastery gives back. Each hit's XP is multiplied by (XP the form's next level costs) ^ this, so higher levels pay more per hit. 0 turns it off: every level costs Valheim's full curve (level 99 about 60 times the hits of level 5). 1 makes every level cost the same number of hits. The default 0.7 leans toward flat: level 99 costs about three times the hits of level 5. Changing this also changes how fast the FIRST levels go, so adjust MasteryXpPerDamageDealt and MasteryXpPerDamageTaken with it. (Added 2026-09-28: mastery was fine early and crawled from the middle on. 0.5 on paper, 0.8 after the first playtest, 0.7 on 2026-09-30.)
# Setting type: Single
# Default value: 0.7
# Acceptable value range: From 0 to 1
MasteryXpCurveCompensation = 0.7

## How much a form's mastery XP speeds up for each boss defeated AFTER the one that unlocked it. The multiplier is 1 + this * (bosses defeated - the form's rung), floored at 1 and capped by MasteryXpBossMultiplierMax. 0 disables it. 
## With the defaults a form pays x1 while its own boss is the newest kill, x4 after the next boss falls and x7 from the one after that. 
## What it is for: the form unlocked first is always the one furthest up the expensive end of the XP curve, and it crawls exactly when a stronger form has just made it look useless. This makes the older rung train faster the further the world has moved past it, which is also the reading that makes sense in fiction: the form is trivial to you now. It multiplies on top of MasteryXpCurveCompensation. 
## It reads the world's global keys, so a server syncs it for free and someone joining late arrives with whatever the group has already killed — the same rule the unlock gate itself follows. 
## Only the five classic bosses count. A form tied to a key this build does not know, which today means the Queen and the Fader, gets no bonus at all rather than a wrong one. 
## (Raised from 2 on 2026-09-28, with the cap going from 4 to 6.)
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 5
MasteryXpPerBossBonus = 3

## Ceiling for the boss XP multiplier from MasteryXpPerBossBonus. The final multiplier is min(this, 1 + bonus * (bosses defeated - the form's rung)), floored at 1. 1 disables the boss bonus entirely. (Raised from 2 on 2026-09-21, together with the mastery XP cut: at a twentieth of the old rate a ceiling of 2 stopped the older form from catching up almost as soon as the bonus started paying. Raised again to 6 on 2026-09-28, with the step going from 2 to 3, and to 7 on 2026-09-30.)
# Setting type: Single
# Default value: 7
# Acceptable value range: From 1 to 20
MasteryXpBossMultiplierMax = 7

