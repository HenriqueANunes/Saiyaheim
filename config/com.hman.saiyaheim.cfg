# Default value: 5
# Acceptable value range: From 1 to 10
LateGameExponent = 5

## Weight of EFFECTIVE health — max health stretched by armor — in the scannable power rating. Applies to players and creatures alike; that shared scale is the whole point of the number, so this is deliberately NOT a per-side knob. Star variants come included for free: the game already multiplies max health by the creature level. (Playtest value, 2026-09-06. Lowered from 1 together with RatingDamageWeight going up: read side by side, bulk was drowning out offence, and a boss that only had a big health pool scanned like a boss that could actually kill you.)
# Setting type: Single
# Default value: 0.8
# Acceptable value range: From 0 to 100
RatingHealthWeight = 0.8

