[5 - Flight]

## Ki per second while flying. Flight should be a tool, not the default way to get around — otherwise the game's hostile terrain turns into scenery. Running out of ki in the air drops you. (Playtest value, 2026-08-13. Went 4 → 15 on 2026-07-31, because at 4 flight was cheap enough to become the default way to travel, then 15 → 10 while playing the ki attack stage, then 10 → 5: with BaseSpeed at 2 the early-game flight is slow enough to hold itself back without the ki cost doing it too. 5 → 3.5 on 2026-09-20: at 5 the level-0 bar bought ten seconds of flight, and players answered that by grinding the skill instead of playing.)
# Setting type: Single
# Default value: 3.5
# Acceptable value range: From 0 to 100
KiPerSecond = 3.5

## Ki cost multiplier while the Run button is held. (Playtest value, 2026-08-13. Was 2.5, above FastSpeedMultiplier on purpose so fast flight cost more per travelled metre; now equal to it, which makes the metre cost the same fast or slow and turns the Run button into a pure time-saver. Raise it above FastSpeedMultiplier to get the penalty back.)
# Setting type: Single
# Default value: 2
# Acceptable value range: From 1 to 10
FastKiMultiplier = 2

## Ki cost multiplier while hovering — airborne with no movement input at all, not even rising or descending. Below 1 holding position is cheaper than travelling, which is how this shipped until 2026-09-20; it was raised to 1 because hovering is exactly the posture used to cheese bosses from out of reach, and the discount was paying for it. See CombatHoverMultiplier for the part that only charges when something is actually fighting you.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
HoverKiMultiplier = 1

## Extra ki cost multiplier for HOVERING while something hostile is alerted nearby — hanging in the air out of reach while a boss or a pack cannot touch you. Stacks on top of HoverKiMultiplier. Flying in combat is NOT affected: diving, circling and pulling out is air combat, which is the point of the mod. Only holding still is. 1 turns it off.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 1 to 10
CombatHoverMultiplier = 3

## How far, in meters, an alerted hostile counts for CombatHoverMultiplier. Measured in 3D from your body, so something 30 m below you still counts — which is the whole point, since that is where it is when you are out of its reach. Tamed creatures and other players never count.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 5 to 100
CombatHoverRange = 30

## Flight speed floor: skill 0, battle power 0, carrying nothing. Everything else is added or multiplied on top of this. CAREFUL: the flight skill bonus MULTIPLIES this floor, so lowering it also shrinks what levelling the skill is worth — at 2, a hundred levels of Flight buy +1 m/s on a fresh character. That is intended here: almost all of the speed is meant to come from SpeedFromPower. (Playtest value, 2026-07-31. Started at 15, went to 10, landed on 2.)
# Setting type: Single
# Default value: 2
# Acceptable value range: From 1 to 100
BaseSpeed = 2

## Speed ADDED per point of raw battle power. With ki on, power is k1*HP + k4*PowerLevel — so eating better and fighting more both make you fly faster, which is the Dragon Ball reading of getting stronger. Additive, like punch damage: enemy scaling is roughly linear across biomes and an additive stat tracks that predictably. Run saiya_fly to see how much this is contributing right now.
# Setting type: Single
# Default value: 0.015
# Acceptable value range: From 0 to 1
SpeedFromPower = 0.015

## How much of a transformation's power gain turns into flight speed: the form multiplies speed by 1 + (PowerMultiplier - 1) * this. At 0.3, SSJ's x2 power is x1.3 speed and SSJ2's x3 is x1.6. Transformations are meant to be felt in combat first; letting the raw PowerMultiplier through sent flight straight into MaxSpeed, where extra power buys no actual velocity and SSJ and SSJ2 stop being distinguishable in the air. 1 restores the old behaviour (form speed = PowerMultiplier), 0 makes forms not affect flight speed at all. (Playtest value, 2026-08-21: flying transformed felt too fast while base form felt right.)
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From 0 to 1
FormSpeedShare = 0.3

