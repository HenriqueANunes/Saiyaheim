# Setting type: Single
# Default value: 3
# Acceptable value range: From 0.5 to 30
ProjectileLifetime = 3

## Minimum Power Level required to use this attack. 0 disables the gate. Independent of the boss gate below: with both set, the attack needs both. Left at 0 like the forms, because the ladder is paced by bosses.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 100
MinPowerLevel = 0

