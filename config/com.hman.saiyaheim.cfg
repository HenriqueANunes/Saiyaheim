[5 - Flight]

## Ki per second while flying. Deliberately high: flight should be a tool, not the default way to get around — otherwise the game's hostile terrain turns into scenery. Running out of ki in the air drops you. (Playtest value, 2026-07-31. Raised from 4: at that cost flight was cheap enough to become the default way to travel.)
# Setting type: Single
# Default value: 15
# Acceptable value range: From 0 to 100
KiPerSecond = 10

## Ki cost multiplier while the Run button is held. Higher than the speed multiplier on purpose: fast flight should cost more per travelled metre, not just more per second.
# Setting type: Single
# Default value: 2.5
# Acceptable value range: From 1 to 10
FastKiMultiplier = 2.5

## Flight speed floor: skill 0, power level 0, carrying nothing. Everything else is added or multiplied on top of this. CAREFUL: the flight skill bonus MULTIPLIES this floor, so lowering it also shrinks what levelling the skill is worth — at 2, a hundred levels of Flight buy +1 m/s on a fresh character. That is intended here: almost all of the speed is meant to come from SpeedFromPower. (Playtest value, 2026-07-31. Started at 15, went to 10, landed on 2.)
# Setting type: Single
# Default value: 2
# Acceptable value range: From 1 to 100
BaseSpeed = 2

## Speed ADDED per point of raw power level. With ki on, power is k1*HP + k4*BattlePower — so eating better and fighting more both make you fly faster, which is the Dragon Ball reading of getting stronger. Additive, like punch damage: enemy scaling is roughly linear across biomes and an additive stat tracks that predictably. Run saiya_fly to see how much this is contributing right now.
# Setting type: Single
# Default value: 0.015
# Acceptable value range: From 0 to 1
SpeedFromPower = 0.015

## Speed multiplier while the Run button is held. Vanilla already reads that button inside its own flight code, so fast flight costs no extra keybind.
# Setting type: Single
# Default value: 1.8
# Acceptable value range: From 1 to 10
FastSpeedMultiplier = 1.8

## Climb and dive speed, as a fraction of the horizontal speed. 1.0 goes up as fast as forward, which makes altitude nearly free. (Lowered from 0.75 after the 2026-07-31 playtest: climbing felt too quick.)
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 2
VerticalSpeedFactor = 0.5

## Turn speed in the air, in degrees per second. Goes straight into m_flyTurnSpeed. The vanilla value is 12, which is a flying-creature number: at 12 a 180-degree turn takes fifteen seconds, and the 2026-07-31 playtest reported exactly that. 200 turns around in about a second. Lower feels heavier and makes high speed harder to steer.
# Setting type: Single
# Default value: 200
# Acceptable value range: From 1 to 720
TurnSpeed = 200

## Speed bonus at level 100 of the flight skill. 0.5 = +50%.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 3
SpeedSkillBonus = 0.5

## Fraction of the ki cost removed at level 100 of the flight skill. 0.5 = at max level flying costs half. Together with SpeedSkillBonus this is the whole progression of the skill: farther per point of ki.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 0.95
KiSkillReduction = 0.5

## How much the late-game power term (Power Level.K5_LateGameBonus) cheapens flight, hyperbolically: cost is multiplied by 1 / (1 + this * bonus). This is the ONLY thing the late-game term changes about flying — speed is deliberately left out of it, because speed already runs into MaxSpeed, which is a zone-streaming limit rather than balance. What being strong buys in the air is range, not velocity. Reads the late-game term alone and not total power, so early flight stays as expensive as KiPerSecond says — the reward belongs to the end of the game. 0 disables it. Check it with saiya_fly.
# Setting type: Single
# Default value: 0.0033
# Acceptable value range: From 0 to 0.1
KiPowerReduction = 0.0033

## Flight skill XP per second airborne. Flying is its own training — there is no other way to raise it. Valheim's own diminishing curve up to 100 applies. (Playtest value, 2026-07-31. Lowered from 1: the skill is what makes flight cheap, and reaching that quickly would undo the cost of KiPerSecond.)
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From 0 to 20
XpPerSecond = 0.3

## Fraction of the speed lost with the inventory at maximum weight. 0.5 = flying fully loaded you go at half speed.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 0.95
WeightPenalty = 0.5

## Minimum Battle Power level required to take off. 0 disables the gate. A placeholder for the boss gating of step 7 — until that decision is made, this is the only lock available on flight.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 100
MinBattlePower = 0

## Hard speed cap, applied after every multiplier. An engine limit, not balance: above a certain speed zone streaming cannot keep up and the world loads in chunks.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 5 to 100
MaxSpeed = 30

## Touching the ground ends the flight by itself, so you do not walk around still burning ki. Only after you have actually left the ground once — otherwise taking off would land you on the same frame.
# Setting type: Boolean
# Default value: true
AutoLandOnGround = true

## Keeps the body horizontal while flying, turning only left and right. The game aims flight rotation at the full movement direction, and the mod puts the climb/dive input into that same vector — so without this, going up flips you belly-up and going down flips you belly-down. The deliberate belly-down lean at speed is a separate, purely visual setting (FastPitch in 5.1) that does not tilt aim or collision.
# Setting type: Boolean
# Default value: true
LevelBody = true

## Forces the standing idle pose while flying, which is the Dragon Ball look. The vanilla player animator has no flight state, so without this you fly in the free-fall pose. Purely visual — turn it off if it breaks some animation. (Confirmed working in the 2026-07-31 playtest.)
# Setting type: Boolean
# Default value: true
ForceIdlePose = true

[6 - Power Level]

## Weight of HP in the power level. Applies to both formulas. Only HP ABOVE the game's minimum (25) counts: those 25 are handed to any new character for free, and counting them would give everyone a floor of power nobody earned. (Fixed in the 2026-07-30 playtest.)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 100
K1_Health = 1

## Weight of the equipped weapon's damage. Only used in the ki-OFF formula.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 100
K2_WeaponDamage = 2

## Weight of equipment armor. Only used in the ki-OFF formula — with ki on, armor is an output of the power level, not an input.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0 to 100
K3_Armor = 1.5

## Weight of the Battle Power skill level (0-100). Only used in the ki-ON formula. It is the only axis of progression for a ki user — without it, power would be constant from the first boss to the last.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 1000
K4_PowerSkill = 3

## Power delivered by the late-game term AT LEVEL 100, on top of K4. It exists because levelling gets brutally more expensive but the reward did not: going from 99 to 100 costs a THOUSAND times what 0 to 1 costs (Valheim's curve is (level+1)^1.5), yet power rose a flat K4 every level. This term makes each level worth more than the one before it. AFFECTS COMBAT ONLY: punch damage, armor, block power and the displayed number. Flight speed and the ki cap deliberately ignore it — see Flight.KiPowerReduction for what late game buys in the air. 0 turns the term off and restores the original linear formula exactly.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 100
K5_LateGameBonus = 3

## How LATE the K5 term wakes up. The term is normalised on level 100, so this never changes what it delivers at the top — only how much of it arrives early. At 5, level 50 has just 3% of the bonus and level 75 has 24%: almost all of it lands in the last quarter, which is exactly the stretch that costs half the total grind. Lower spreads it out, higher concentrates it further.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 1 to 10
LateGameExponent = 5

## Exponent of the compression applied to the raw power level before display. 0.5 = square root, 1.0 = no compression. It exists so the number does not become huge and meaningless too early.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0.1 to 1
CompressionExponent = 0.5

## Multiplier applied after the compression, purely for readability.
# Setting type: Single
# Default value: 100
# Acceptable value range: From 1 to 10000
DisplayScale = 100

[6.1 - Battle Power]

## XP per point of damage dealt, CAPPED at the target's remaining HP. That cap is what kills weak-mob farming: a 5000 damage punch on a 10 HP boar counts as 10. (Playtest value, 2026-08-01: 0.05 made the early levels crawl.)
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0 to 10
XpPerDamageDealt = 0.1

## XP per point of damage taken, measured AFTER armor. Measuring it after armor is what kills the exploit of taking hits on purpose from a weak enemy: taking little damage pays little. (Playtest value, 2026-08-01: kept equal to XpPerDamageDealt on purpose — the two sides of the fight should pay the same.)
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0 to 10
XpPerDamageTaken = 0.1

## Extra XP with the inventory at maximum weight. 1.0 = doubles the gain. This is Goku's weighted clothing, and it is self-limiting: weight slows you down, eats stamina and lowers flight speed. The player pays mobility for progression.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 10
XpWeightBonus = 1

## Safety clamp: maximum XP from a single hit, dealt or taken. Prevents one hit on a boss from jumping several levels at once.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0.1 to 1000
XpMaxPerEvent = 5

[7 - HUD]

## Show the ki bar.
# Setting type: Boolean
# Default value: true
ShowKiBar = true

## Horizontal offset of the ki bar, in pixels. Applies live: edit the file with the game running and the bar moves.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -500 to 500
KiBarOffsetX = 0

## Vertical offset of the ki bar, in pixels, relative to the position of the native bars. Negative moves down. Applies live. Do not raise this much: at -30 the ki bar lands on top of the stamina bar. (Playtest value, 2026-07-31.)
# Setting type: Single
# Default value: -50
# Acceptable value range: From -500 to 500
KiBarOffsetY = -50

## Ki bar color, #RRGGBB format. Applies when the config reloads.
# Setting type: String
# Default value: #4FC3F7
KiBarColor = #4FC3F7

## If true, the ki bar stays on screen at all times. If false (default), it hides when ki is full and comes back when you spend, just like the native stamina and eitr bars. With ki turned OFF the bar hides in both cases.
# Setting type: Boolean
# Default value: false
KiBarAlwaysVisible = false

[8 - Effects]

## Visual effect prefab attached to the player while charging. Empty disables it. Candidates include fx_ShieldCharge_1 through _5 (increasing intensity) and fx_chainlightning_spread.
# Setting type: String
# Default value: fx_DvergerMage_Support_start
ChargeEffectPrefab = fx_DvergerMage_Support_start

## Sound prefab looped while charging. Empty disables it. Alternatives: sfx_StaffLightning_charge, sfx_staff_lightning_charge.
# Setting type: String
# Default value: sfx_charred_mage_attack_charge
ChargeSoundPrefab = sfx_charred_mage_attack_charge

## Charging effect color, #RRGGBB format. Empty keeps the prefab's original color. Applies on the next charge — no restart needed. The original particle fade is preserved; only the base color changes. Ignored while you are transformed: charging in a form glows in that form's AuraColor instead, so the two read as one thing happening harder.
# Setting type: String
# Default value: #4FC3F7
ChargeEffectColor = #4FC3F7

## Scale of the visual effect. The Dverger support effect is born far too small at player scale and needs to be doubled. (Calibrated in the 2026-07-28 playtest.)
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0.1 to 5
ChargeEffectScale = 2

## Forces the effect's particles and audio to repeat. Game prefabs are built for a quick burst; without this the effect disappears on its own after a second. Turn it off if some prefab looks wrong when repeating.
# Setting type: Boolean
# Default value: true
ChargeEffectForceLoop = true

## One-shot emote played when you power up into a form. Empty disables it. Not played when stepping DOWN a form: coming down is relief, not a burst. Any emote the player Animator knows works — the same names the /emote chat command lists.
# Setting type: String
# Default value: roar
TransformEmote = roar

## Effect burst when you power up into a form. Empty disables it. It fires once and fades — see TransformAuraForceLoop for why it is not kept alive while the form lasts. Not played when stepping DOWN a form, same as the emote. The color comes from each form's own AuraColor, not from here. Alternatives: fx_goblinking_nova, fx_ShieldCharge_1 through _5 (increasing), DvergerStaffNova_aoe.
# Setting type: String
# Default value: fx_DvergerMage_Support_start
TransformAuraPrefab = fx_DvergerMage_Support_start

## Scale of the burst. Slightly larger than the charging effect on purpose: transforming should read bigger than charging up to it.
# Setting type: Single
# Default value: 2.5
# Acceptable value range: From 0.1 to 5
TransformAuraScale = 2.5

## How long the burst lasts, in seconds, before it is removed from the player. This is enforced by the mod and does not depend on the prefab cleaning up after itself — some of them never do, which is what used to leave the effect burning for the whole transformation. Ignored when TransformAuraForceLoop is on, where the effect is meant to last as long as the form. 0 hands the decision back to the prefab. (Starting value. Not playtested yet.)
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 10
TransformAuraDuration = 2

## Keeps the effect alive for as long as the form lasts, by forcing its particles and audio to repeat. OFF by default, and that is a playtest result, not an oversight: game prefabs are built for a half-second burst, and looping one does not make it last longer — it makes it a permanent cloud stuck to the player. The particles never get to disperse. Turning this on with a prefab designed for a sustained aura is fine; turning it on with a burst prefab is what produced the smoke. (Playtest value, 2026-08-02.)
# Setting type: Boolean
# Default value: false
TransformAuraForceLoop = false

## Multiplier for the effect's dynamic light. 1 leaves the prefab as it came, which is right for a burst — the flash is most of the punch. 0 removes the light entirely and keeps only the particles. That matters if you turn TransformAuraForceLoop on: a light that follows you for minutes lights up the terrain around you and gets tiring, while the particles glow on their own and do not need it.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 2
TransformAuraLightIntensity = 1

[8.1 - Ki Charge Pose]

## Procedurally poses the body while charging ki, muscle by muscle, on top of whatever the game's animation is doing. Off means charging has no animation at all — the emote it replaced was removed on 2026-08-07.
# Setting type: Boolean
# Default value: true
Enabled = true

## Seconds for the pose to come in when you start charging and to leave when you stop. Zero snaps.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0 to 2
BlendSeconds = 0.25

## How much of the CHEST the pose owns. THIS IS A SWITCH, not an intensity: zero is not 'neutral chest', it is 'do not touch the chest, leave the animation alone'. That distinction is why every group here has a weight — a target of zero would force a muscle to its neutral value, which is itself a pose. Same for every other weight below. The chest is the joint that bends the torso WITHOUT taking the hips with it, which is why it is the one that starts on.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
ChestWeight = 1

## How much of the UPPER chest the pose owns — the joint above the chest, the most isolated of the three. Use it on top of the chest for a deeper bend that still does not reach the hips, or alone for the subtlest possible lean.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
UpperChestWeight = 1

## How much of the LOWER BACK the pose owns. Off by default and it should probably stay that way: in the Valheim rig this joint drags the hips along with it, so bending it moves the legs too. It is what made the first version of this pose look wrong on 2026-08-07, and it is the same joint the flight pose keeps small for the same reason. Turn it on only if the lean needs to come from the waist.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
SpineWeight = 0

## How much of the shoulders the pose owns. Zero leaves them to the animation.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
ShoulderWeight = 1

## How much of the neck and head the pose owns. Zero leaves them to the animation — including the game's own look-at, which aims the head at whatever you are looking at and is usually worth keeping.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
HeadWeight = 1

## How much of both arms the pose owns — upper arm, twist and elbow. Zero leaves them exactly as the animation has them. FistClench is deliberately outside this group: a closed hand still reads as tension on an otherwise normal arm.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
ArmWeight = 1

## How much of both legs the pose owns — stance width, knees and the hip drop that goes with them. Zero leaves the legs to the animation, which also makes the feet-off-the-ground problem described under KneeBend impossible.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
LegWeight = 0

## How far the CHEST bends FORWARD, when ChestWeight is on. Negative arches back. This and the two below used to be a single 'Lean' split between the joints by a fixed ratio in code — which meant the lower back always came along, hips and all. Reported as bad on screen on 2026-08-07 and split into three.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From -1 to 1
ChestLean = 0.5

## How far the UPPER chest bends forward, when UpperChestWeight is on. Negative arches back.
# Setting type: Single
# Default value: 0.2
# Acceptable value range: From -1 to 1
UpperChestLean = 0.5

## How far the LOWER BACK bends forward, when SpineWeight is on. Keep it small: this joint carries the hips. Negative arches back.
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From -1 to 1
SpineLean = 0

## How far the shoulders are pulled UP. This is most of what reads as 'tense' — the same pose with relaxed shoulders reads as standing around.
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From -1 to 1
ShoulderShrug = -0.5

## How far the chin drops. Split between neck and head. Negative looks up instead, which is the other classic reading of the same pose — worth trying if the effect column ever goes up into the sky.
# Setting type: Single
# Default value: 0.15
# Acceptable value range: From -1 to 1
HeadTilt = 0.5

## Where the upper arms sit. This one is raw muscle space, not intent: 0 is a T-pose and about -0.65 is arms hanging straight down. -0.5 leaves the elbows slightly flared, which is what makes the fists land beside the hips instead of in front of the crotch.
# Setting type: Single
# Default value: -0.5
# Acceptable value range: From -1 to 1
ArmDown = -0.2

## How far the upper arms are pulled BACK, behind the ribs. Together with ElbowBend this is what puts the fists at the hips rather than in front of the belly. Negative pushes them forward.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From -1 to 1
ArmBack = -0.25

## Rotation of the upper arm along its own length. It does nothing by itself and everything in combination: it decides WHERE the bent elbow points the forearm. Change this first if the forearms cross the body or stick out sideways instead of coming forward.
# Setting type: Single
# Default value: 0.15
# Acceptable value range: From -1 to 1
ArmTwist = 0.15

## How far the elbows are bent. 0 is a straight arm, 1 is the tightest bend the rig allows.
# Setting type: Single
# Default value: 0.7
# Acceptable value range: From -1 to 1
ElbowBend = 0.3

## How hard the hands close, independently of ArmWeight — a closed fist reads as tension even on an arm the pose is not touching. Fingers are muscles like any other, so this costs nothing but the names. Zero leaves the hands as the animation had them. Does nothing if the player rig has no mapped finger bones — no error, just no fist.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
FistClench = 1

## How far apart the feet are planted. Both legs get the same value, which in Unity muscle space should spread them symmetrically — if they scissor instead of spreading, one of the two signs needs flipping in code, so report it.
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From -1 to 1
StanceWidth = 0.3

## How deep the half squat is. READ HipDrop BEFORE RAISING THIS: bending the knees shortens the leg, and if the hips do not come down by the same amount the feet leave the ground. The game's foot IK will NOT save it — it runs before the mod writes the pose.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From -1 to 1
KneeBend = 0.25

## How far the hips come down, per unit of KneeBend, so the squat is a squat and not a character floating with folded legs. In avatar units, which for a player-sized rig is roughly meters — the default is about 4 cm at the default KneeBend. Too low and the feet hover; too high and the legs sink into the ground. Zero disables it, which is the safe fallback if it looks wrong.
# Setting type: Single
# Default value: 0.16
# Acceptable value range: From 0 to 1
HipDrop = 0.16

## Amplitude of the slow heave: the whole body sinking and rising, like someone straining. This is the one that makes the pose look alive. Zero freezes it.
# Setting type: Single
# Default value: 0.07
# Acceptable value range: From 0 to 0.5
Strain = 0.07

## Speed of the slow heave, in radians per second. Around 2 is roughly one cycle every three seconds — heavy breathing. Much faster stops reading as effort.
# Setting type: Single
# Default value: 2.2
# Acceptable value range: From 0.1 to 20
StrainSpeed = 2.2

## Amplitude of the fast tremble, ON TOP of whichever muscle groups are turned on above — it has nothing to shake in a group whose weight is zero. Off by default: start from the still pose and dial this up until it reads as effort. Deliberately tiny when on, around 0.02: this should be felt, not seen. If you can tell it is a sine wave, it is too high.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 0.3
Tremor = 0

## Speed of the fast tremble, in radians per second. The two sides run at slightly different rates on purpose — in sync it reads as machine vibration, out of phase it reads as muscle.
# Setting type: Single
# Default value: 17
# Acceptable value range: From 1 to 60
TremorSpeed = 17

[8.2 - Ki Blast Pose]

## Procedurally throws the right arm forward when a ki blast leaves your hand, on top of whatever the game's animation is doing. Off means firing has no animation at all, which is how it shipped on 2026-08-06.
# Setting type: Boolean
# Default value: true
Enabled = true

## Seconds for the arm to snap out. Keep it SHORT and shorter than FallSeconds: a slow rise turns a thrust into a stretch. Zero snaps instantly, which is also fine here.
# Setting type: Single
# Default value: 0.06
# Acceptable value range: From 0 to 1
RiseSeconds = 0.06

## Seconds the arm stays out at full extension before relaxing. Firing again before it ends just pushes this deadline forward — the arm does not drop and snap back between shots of a burst.
# Setting type: Single
# Default value: 0.18
# Acceptable value range: From 0 to 3
HoldSeconds = 0.18

## Seconds for the arm to come back. LONGER than RiseSeconds on purpose: the gesture is a snap out and a relax back, and a fast return reads as the animation being cut rather than ending.
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From 0 to 3
FallSeconds = 0.3

## How much of the RIGHT ARM the pose owns — upper arm, twist and elbow. THIS IS A SWITCH, not an intensity: zero is not 'neutral arm', it is 'do not touch the arm, leave the animation alone'. A target of zero would instead force the muscle to its neutral value, which is itself a pose (a T-pose, in this case). Same for every other weight below. This is the one group that starts ON, because it is the whole request.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
ArmWeight = 1

## How much of the right SHOULDER the pose owns. This is what turns 'arm raised' into 'arm extended' — without it the reach stops at the shoulder socket and the character looks like he is pointing rather than pushing. Turn it on second, right after the arm.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
ShoulderWeight = 0

## How much of the TORSO TWIST the pose owns — chest and upper chest bringing the right shoulder around to follow the arm. Turn it on third. Zero leaves the torso to the animation, including whatever twist the game's aiming does.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
TorsoWeight = 0

## How much of the twist reaches the LOWER BACK, as a fraction of TorsoWeight. Off by default and it should probably stay that way: in the Valheim rig this joint drags the hips along, so twisting it turns the whole character away from where he is aiming. It is the same joint the charging pose and the flight pose both keep out for the same reason.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
SpineTwistWeight = 0

## How far the upper arm swings FORWARD. This is the gesture: at 0 the arm is out to the side, at 1 it points straight ahead. Negative pulls it behind the ribs, which is the charging pose, not this one.
# Setting type: Single
# Default value: 0.9
# Acceptable value range: From -1 to 1
ArmForward = 0.9

## Where the upper arm sits vertically. Raw muscle space, not intent: 0 is a T-pose, meaning the arm is horizontal — which is already shoulder height, so 0 is the right starting point for aiming straight ahead. About -0.65 is the arm hanging down. Positive raises it above the shoulder.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -1 to 1
ArmHeight = 0

## How much the arm follows where you are LOOKING, added on top of ArmHeight. This matters more than it sounds: the projectile spawns at the right hand and flies along your look direction, so with a locked arm, aiming at the sky sends the shot upward out of a hand that is pointing at the horizon. 1 is full follow, 0 pins the arm to ArmHeight.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
AimFollow = 0.5

## Rotation of the upper arm along its own length. Raw muscle space. With the elbow straight it barely changes the silhouette, but it decides which way the PALM faces — and the ki ball is born in that hand. Change this if the back of the hand ends up facing the target.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -1 to 1
ArmTwist = 0

## How far the elbow is bent. Raw muscle space: 0 is a straight arm, which is what the pose asks for, and 1 is the tightest bend the rig allows. Raise it slightly if a fully locked elbow reads as stiff.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -1 to 1
ElbowBend = 0

## How far the right shoulder is pushed FORWARD, when ShoulderWeight is on. This is the extra reach. Negative pulls it back.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From -1 to 1
ShoulderPush = 0.5

## How far the right shoulder rides UP, when ShoulderWeight is on. Raw muscle space. Small: a shrugged shoulder on an extended arm reads as flinching.
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From -1 to 1
ShoulderLift = 0.1

## How far the torso rotates to bring the right shoulder AROUND, when TorsoWeight is on. Split across the three spine joints, most at the top and least at the bottom. Keep it small — the point is the torso following the arm, not the character turning sideways to his own aim. Negative twists the other way, which would pull the firing shoulder back.
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From -1 to 1
TorsoTwist = 0.3

## How far the right hand opens into a flat palm, independently of ArmWeight — the exact opposite of the charging pose's FistClench, and the contrast is the point: charging is a closed fist, firing is an open palm. Zero leaves the hand as the animation had it. Does nothing if the player rig has no mapped finger bones — no error, just no palm.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
HandOpen = 0

## How far the wrist bends back, so the palm faces where the shot is going. Raw muscle space, and it rides on HandOpen rather than having a weight of its own: a pushed palm and an open hand are one gesture. Negative curls the wrist the other way.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -1 to 1
WristBend = 0

[9 - Debug]

## Detailed logging in the BepInEx console.
# Setting type: Boolean
# Default value: false
VerboseLogging = true

