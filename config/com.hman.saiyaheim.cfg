# Default value: 0.5
# Acceptable value range: From 0 to 3
SpeedSkillBonus = 0.5

## Fraction of the ki cost removed at level 100 of the flight skill. 0.95 = at max level flying costs a twentieth. Together with SpeedSkillBonus this is the whole progression of the skill: farther per point of ki. KiSkillCurve decides how much of it arrives before level 100.
# Setting type: Single
# Default value: 0.95
# Acceptable value range: From 0 to 0.99
KiSkillReduction = 0.95

## Shape of the flight skill discount: reduction = KiSkillReduction * (level/100)^this. 1 is a straight line, so half the skill gives half the discount. Above 1 the saving is back-loaded — the last levels are where flight actually gets cheap, which is what keeps early flight expensive while still making level 100 feel like an arrival. Below 1 front-loads it. Check it with saiya_fly skill <level>.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.25 to 5
KiSkillCurve = 1

## How much the late-game power term (Battle Power.K5_LateGameBonus) cheapens flight, hyperbolically: cost is multiplied by 1 / (1 + this * bonus). This is the ONLY thing the late-game term changes about flying — speed is deliberately left out of it, because speed already runs into MaxSpeed, which is a zone-streaming limit rather than balance. What being strong buys in the air is range, not velocity. Reads the late-game term alone and not total power, so early flight stays as expensive as KiPerSecond says — the reward belongs to the end of the game. 0 disables it. Check it with saiya_fly.
# Setting type: Single
# Default value: 0.0033
# Acceptable value range: From 0 to 0.1
KiPowerReduction = 0.0033

## How much a transformation makes flying cost, as a fraction of the power it adds: cost is multiplied by 1 + (PowerMultiplier - 1) * this * (1 - mastery). At 0.3, SSJ (x2 power) makes flight 30% more expensive and SSJ3 (x4) 90%, and both fade to nothing at level 100 of THAT form's mastery. It mirrors FormSpeedShare deliberately: the form pays for the speed it gives. Note the payer is the form's mastery, which trains by FIGHTING transformed — flying transformed does not make flying transformed any cheaper. 0 gives the form's flight speed away for free, which is what happened before 2026-09-20. (Starting value. Not playtested yet.)
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From 0 to 2
FormKiShare = 0.3

## Flight skill XP per METER flown. Flying is its own training — there is no other way to raise it — but hovering in place pays nothing, because nothing moves. Distance here is the path travelled, not the distance from where you took off: flying out and back pays for both legs, since both cost ki. Valheim's own diminishing curve up to 100 applies. (Replaced XpPerSecond on 2026-09-20 — 0.15/m is what 0.5/s was worth at base speed. The old key stays behind in existing config files, inert. Halved to 0.075 on 2026-09-20: the first playtest of the rework levelled far too fast.)
# Setting type: Single
# Default value: 0.075
# Acceptable value range: From 0 to 5
XpPerMeter = 0.075

## Fraction of fall damage removed at level 100 of the flight skill, linear in the level (0.8 = 40% less at level 50, 80% less at 100). Only while ki is on — an empty bar still protects, turning ki off does not. Flying itself never takes fall damage; this is for jumping off cliffs and dropping out of flight. Stacks multiplicatively with the game's own fall protection (feather cape). 0 disables it, 1 makes level 100 immune.
# Setting type: Single
# Default value: 0.8
# Acceptable value range: From 0 to 1
FallDamageSkillReduction = 0.8

## Fraction of the speed lost with the inventory at maximum weight. 0.5 = flying fully loaded you go at half speed. (Playtest value, 2026-08-11. Raised from 0.5: hauling a full inventory by air should cost something the player can feel.)
# Setting type: Single
# Default value: 0.6
# Acceptable value range: From 0 to 0.95
WeightPenalty = 0.6

## Shape of the weight penalty: speed loss = WeightPenalty * (carried/max)^this. 1 is a straight line, so half loaded costs half the penalty. Above 1 the penalty is back-loaded — light and medium loads barely register and the speed falls off sharply as the inventory fills, which is what keeps casual looting from feeling taxed. Below 1 front-loads it. (Playtest value, 2026-09-06. Went straight to the top of the range: at 3 the penalty was still noticeable at half load, and the whole point of the curve was that only a full inventory should slow you down.)
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0.25 to 5
WeightCurve = 5

