## Left lower leg stretch — the knee bend. (Value from the 2026-07-31 playtest; the sign shipped inverted.)
# Setting type: Single
# Default value: 0.7
# Acceptable value range: From -1 to 1
LegBendLeft = 0.7

## Right lower leg stretch. Set this differently from LegBendLeft to tuck one leg and leave the other extended.
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From -1 to 1
LegBendRight = 0.3

## Left upper leg in-out. Closes or opens the standing stance; legs apart is a strong tell that the character is really just standing in mid-air.
