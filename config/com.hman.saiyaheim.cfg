## Settings file was created by plugin Saiyaheim v0.7.0
## Plugin GUID: com.hman.saiyaheim

[1 - General]

## Key that toggles ki on and off. Ki turned off behaves like zero ki: no damage bonus, no mastery accumulating, no ki term in the battle power.
# Setting type: KeyboardShortcut
# Default value: K
ToggleKiKey = K

## Starting ki state on a brand new character.
# Setting type: Boolean
# Default value: true
KiEnabledByDefault = true

## Key HELD DOWN to actively charge ki, far faster than passive regeneration.
# Setting type: KeyboardShortcut
# Default value: R
ChargeKiKey = R

## Key that takes off and lands. Once airborne, movement is the usual one: the game's Jump button climbs, Crouch descends and Run flies fast.
# Setting type: KeyboardShortcut
# Default value: F
ToggleFlightKey = F

## Key that switches flight between classic and aim mode. Classic: forward is always level and only Jump and Crouch change altitude. Aim: moving forward flies where you are looking, up and down included, and moving back flies the opposite way; strafing stays level and Jump and Crouch still work on top. Aim is the default. Works on the ground or in the air, and the choice is saved with the character.
# Setting type: KeyboardShortcut
# Default value: F + LeftAlt
ToggleFlightAimKey = F + LeftAlt

## Key that transforms straight into the HIGHEST form you have unlocked, skipping everything below it. Does nothing when you are already there.
# Setting type: KeyboardShortcut
# Default value: T
TransformKey = T

## Key that goes UP one step on the ladder: base form to SSJ, SSJ to SSJ2, and so on. Use it to stop at an intermediate form instead of jumping to the top. Does nothing at the top of what you have unlocked.
# Setting type: KeyboardShortcut
# Default value: T + LeftShift
TransformStepUpKey = T + LeftShift

## Key that drops you straight back to base form, from whatever step you are on — no walking back down the ladder. Running out of ki does the same thing on its own: at zero there is nothing to hold any form with.
# Setting type: KeyboardShortcut
# Default value: Z
PowerDownKey = Z

## Key that goes DOWN one step, to trade power for a smaller ki drain without leaving the ladder entirely. From the first form it returns to base.
# Setting type: KeyboardShortcut
# Default value: Z + LeftShift
TransformStepDownKey = Z + LeftShift

## Kaioken key. Press to turn it on at x2, and press again to go up one tier, up to the highest you have learned. Works on top of any form, base form included.
# Setting type: KeyboardShortcut
# Default value: Y
KaiokenKey = Q

## Key that turns Kaioken off, from any tier.
# Setting type: KeyboardShortcut
# Default value: Y + LeftShift
KaiokenOffKey = Q + LeftShift

## Key that fires the selected ki attack, aimed where you are looking. Needs ki turned on, enough ki for the shot, and the attack unlocked. The ki is spent on the shot, hit or miss.
# Setting type: KeyboardShortcut
# Default value: V
FireKiAttackKey = V

## Key that cycles through the ki attacks you have unlocked. With a single one unlocked it just names it on screen. The selection is not saved: every session starts on the first attack.
# Setting type: KeyboardShortcut
# Default value: V + LeftShift
CycleKiAttackKey = V + LeftShift

## Tapping the Jump button twice quickly takes off, on the ground or mid-air. It only takes OFF, never lands: Jump is what climbs while flying, so a double tap up there would fight the control you are already using. ToggleFlightKey and touching the ground are what land you.
# Setting type: Boolean
# Default value: true
TakeOffOnDoubleJump = true

## Maximum seconds between the two taps. Too high and normal jump spamming launches you by accident; too low and the double tap stops registering.
# Setting type: Single
# Default value: 0.35
# Acceptable value range: From 0.05 to 1
DoubleJumpWindow = 0.35

OpenRadialKey = Q

