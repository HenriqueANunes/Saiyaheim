# Setting type: Single
# Default value: 10
# Acceptable value range: From 0 to 1000
DamageBase = 10

## Share of the COMBAT battle power added to this attack's damage. Same number the punch reads, so the attack keeps up with the fists instead of falling behind, transforming makes it stronger for free, and the late-game term applies to it as well. Careful: this is a RANGED hit with no wind-up, so it should sit below PunchDamageFromPower or there is no reason to ever close distance. (Starting value. Not playtested yet.)
# Setting type: Single
# Default value: 0.04
# Acceptable value range: From 0 to 10
DamageFromPower = 0.04

## Ki spent per projectile, charged when you fire — hit or miss. Charging on impact instead would reward aim and punish fighting anything fast, which is the opposite of what a ranged attack should teach. On a charged attack (ChargeTime above 0) this is spent WHILE THE CHARGE GROWS, as it produces each projectile, and letting go costs nothing. A full charge stops costing, however long the key is held after that: what is paid for is projectiles, and at the top there are no more coming. The rate per second is this times BeamCount divided by ChargeTime — saiya_blast prints it. FLAT on purpose, unlike the punch, which costs per point of damage: this is the starting shape and it is expected to get cheap late, when the bar has grown and this number has not. Watch it with saiya_blast, which prints shots per full bar.
# Setting type: Single
# Default value: 20
# Acceptable value range: From 0 to 1000
KiCost = 20

## Seconds before this attack can be fired again. Without it the rate of fire is limited only by the frame rate and by the bar, which turns the attack into a machine gun and makes KiCost the only thing standing between the player and emptying the bar in one second.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 30
Cooldown = 0.5

## Push applied to whatever is hit. It is what makes the shot read as an impact rather than a scratch, and it buys back the distance the attack exists to keep.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 0 to 500
Knockback = 30

## How many projectiles one press fires. 1 is a single shot. Higher turns the attack into a stream: fired close enough together, a line of projectiles reads as one continuous beam, which is exactly how the game itself draws Yagluth's beam. Damage, ki cost and knockback below are PER PROJECTILE, so this multiplies all three — saiya_blast prints the totals. Raise it for a longer beam, and lower BeamInterval to close the gaps.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 1 to 60
BeamCount = 1

## Seconds between one projectile of a beam and the next. It sets both how long the beam lasts (BeamCount x this) and how far apart the projectiles sit in the air (ProjectileSpeed x this) — and that spacing is what decides whether the eye reads a beam or a row of pellets. Ignored when BeamCount is 1. Aim is recomputed for every projectile, so a long beam follows the crosshair instead of pointing where it started.
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0.01 to 1
BeamInterval = 0.05

## Seconds of holding the fire key to reach a full charge. 0 turns charging off and the attack fires on the key press, with the whole beam at once — which is what the ki blast does. Holding longer fires MORE projectiles, up to BeamCount, and makes them thicker; it does NOT make each projectile hit harder. So the ki spent and the damage dealt both grow with the hold, in a straight line. The ki is spent WHILE THE CHARGE GROWS, not on release: you pay for each projectile the moment the charge produces it, so the bar going down is the charge meter, and it stops going down the instant the charge is full — holding a finished charge is free, because there is nothing left to buy. Running the bar dry fires the attack immediately with whatever was paid for: holding a key that has stopped doing anything would only be found out on release.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 30
ChargeTime = 0

## Smallest fraction of a full charge that still fires, from 0 to 1. Letting go below it drops the charge instead of firing, so brushing the key does not throw a single projectile the player never meant to fire. The ki that fraction of a second already drained does NOT come back — refunding it would mean tracking the spend tick by tick, for a few points of a bar measured in hundreds. It is ignored when the bar runs dry mid-charge: that fires whatever was paid for, however short, because refusing there would charge for nothing. Ignored entirely when ChargeTime is 0.
# Setting type: Single
# Default value: 0.15
# Acceptable value range: From 0 to 1
MinChargeRatio = 0.15

## Projectile speed in metres per second. For reference, a player runs at about 5 and flies at up to 30. Too slow and anything mobile walks out of the way; too fast and there is nothing to see between the hand and the target.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 1 to 200
ProjectileSpeed = 30

