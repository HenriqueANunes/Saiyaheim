## Settings file was created by plugin Saiyaheim v0.1.0
## Plugin GUID: com.hman.saiyaheim

[1 - Geral]

## Tecla que liga/desliga o ki. Ki desligado se comporta como ki zerado: sem bonus de dano, sem maestria acumulando, sem componente de ki no power level.
# Setting type: KeyboardShortcut
# Default value: K
ToggleKiKey = K

## Estado inicial do ki em um personagem novo.
# Setting type: Boolean
# Default value: true
KiEnabledByDefault = true

## Tecla SEGURADA para carregar ki ativamente, bem mais rapido que a regeneracao passiva.
# Setting type: KeyboardShortcut
# Default value: R
ChargeKiKey = R

[2 - Ki]

## Ki maximo do jogador.
# Setting type: Single
# Default value: 100
# Acceptable value range: From 10 to 10000
MaxKi = 100

## Ki regenerado por segundo em repouso.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 500
KiRegenPerSecond = 0.5

## Intervalo em segundos do tick de ki (regeneracao e dreno). Valor menor da leitura mais suave e custa mais CPU.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0.05 to 1
KiTickInterval = 0.25

## Segundos sem regenerar depois de gastar ki.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 10
KiRegenDelay = 5

## Ki por segundo enquanto a tecla de carregar esta segurada. Deve ser bem maior que KiRegenPerSecond — a graca e que carregar seja uma acao deliberada que vale a pena, nao so esperar mais rapido. Ignora o KiRegenDelay de proposito.
# Setting type: Single
# Default value: 15
# Acceptable value range: From 0 to 500
ChargeKiPerSecond = 15

## Se true, andar interrompe o carregamento. Carregar parado e o gesto classico de Dragon Ball, mas atrapalha em combate — vale testar os dois.
# Setting type: Boolean
# Default value: false
ChargeRequiresStandingStill = true

[3 - Transformacoes]

## Custo pontual de ki ao ativar uma transformacao.
# Setting type: Single
# Default value: 20
# Acceptable value range: From 0 to 1000
ActivationCost = 20

## Dreno base de ki por segundo, antes da reducao por maestria.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 100
DrainPerSecond = 5

[4 - Maestria]

## Fracao do dreno removida no nivel 100. Formula: dreno = base * (1 - nivel/100 * este_valor). 0.8 = no nivel 100 o dreno cai para 20% do base. Cuidado: valor alto demais torna a forma praticamente permanente e o ki deixa de ser tensao.
# Setting type: Single
# Default value: 0.8
# Acceptable value range: From 0 to 0.95
DrainReductionAtMaxLevel = 0.8

## XP da skill da forma por tick de ki enquanto transformado. A curva de ganho decrescente ate o nivel 100 e a do proprio Valheim.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0 to 10
XpPerTick = 0.25

[5 - Voo]

## Ki por segundo voando. Alto de proposito: o voo deve ser ferramenta, nao o modo padrao de locomocao — senao o terreno hostil do jogo vira paisagem.
# Setting type: Single
# Default value: 4
# Acceptable value range: From 0 to 100
KiPerSecond = 4

## Velocidade de voo no nivel 0 da skill, sem carga.
# Setting type: Single
# Default value: 15
# Acceptable value range: From 1 to 100
BaseSpeed = 15

## Bonus de velocidade no nivel 100 da skill de voo. 0.5 = +50%.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 3
SpeedSkillBonus = 0.5

## Fracao da velocidade perdida com o inventario no peso maximo. 0.5 = voando lotado voce vai a metade da velocidade.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 0.95
WeightPenalty = 0.5

## Teto duro de velocidade. Limite do motor, nao balanceamento: acima de certa velocidade o streaming de zonas nao acompanha e o mundo carrega em pedaços.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 5 to 100
MaxSpeed = 30

[6 - Power Level]

## Peso do HP efetivo no power level.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 100
K1_Health = 1

## Peso do dano da arma equipada no power level.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 100
K2_WeaponDamage = 2

## Peso da armadura total no power level.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0 to 100
K3_Armor = 1.5

## Peso do componente de ki (ki maximo, maestria, forma ativa). Zerado quando o jogador esta com o ki desligado.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 100
K4_Ki = 3

## Expoente da compressao do power level bruto antes de exibir. 0.5 = raiz quadrada, 1.0 = sem compressao. Existe para o numero nao virar gigante e vazio cedo demais.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0.1 to 1
CompressionExponent = 0.5

## Multiplicador aplicado depois da compressao, so para leitura.
# Setting type: Single
# Default value: 100
# Acceptable value range: From 1 to 10000
DisplayScale = 100

[7 - HUD]

## Mostra a barra de ki.
# Setting type: Boolean
# Default value: true
ShowKiBar = true

## Deslocamento horizontal da barra de ki, em pixels. Aplica ao vivo: edite o arquivo com o jogo aberto e a barra se move.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -500 to 500
KiBarOffsetX = 0

## Deslocamento vertical da barra de ki, em pixels, relativo a posicao das barras nativas. Negativo desce. Aplica ao vivo.
# Setting type: Single
# Default value: -34
# Acceptable value range: From -500 to 500
KiBarOffsetY = -30

## Cor da barra de ki, formato #RRGGBB. Aplica ao recarregar a config.
# Setting type: String
# Default value: #4FC3F7
KiBarColor = #4FC3F7

## Se true, a barra de ki fica sempre na tela. Se false (padrao), some quando o ki esta cheio e reaparece ao gastar, igual as barras nativas de stamina e eitr. Com o ki DESLIGADO a barra some nos dois casos.
# Setting type: Boolean
# Default value: false
KiBarAlwaysVisible = false

[8 - Efeitos]

## Emote tocado em loop enquanto carrega ki. Vazio desliga a animacao. Rode saiya_dumpemotes no console (F5) para ver a lista valida — os do tipo Bool sao os que ficam em loop.
# Setting type: String
# Default value: challenge
ChargeEmote = roar

## Prefab de efeito visual preso ao jogador enquanto carrega. Vazio desliga. Rode saiya_dumpprefabs para a lista completa; ha candidatos como fx_ShieldCharge_1 ate _5 (intensidade crescente) e fx_chainlightning_spread.
# Setting type: String
# Default value: fx_DvergerMage_Support_start
ChargeEffectPrefab = fx_DvergerMage_Support_start

## Prefab de som tocado em loop enquanto carrega. Vazio desliga. Alternativas: sfx_StaffLightning_charge, sfx_staff_lightning_charge.
# Setting type: String
# Default value: sfx_charred_mage_attack_charge
ChargeSoundPrefab = sfx_charred_mage_attack_charge

## Cor do efeito de carregamento, formato #RRGGBB. Vazio mantem a cor original do prefab. Aplica no proximo carregamento — nao precisa reiniciar. O fade original das particulas e preservado; so a cor base muda.
# Setting type: String
# Default value: #4FC3F7
ChargeEffectColor = #4FC3F7

## Escala do efeito visual. Efeitos de boss costumam precisar encolher.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.1 to 5
ChargeEffectScale = 2

## Forca particulas e audio do efeito a repetir. Prefabs do jogo sao feitos para um estouro rapido; sem isso o efeito some sozinho depois de um segundo. Desligue se algum prefab ficar estranho repetindo.
# Setting type: Boolean
# Default value: true
ChargeEffectForceLoop = true

[9 - Debug]

## Log detalhado no console do BepInEx.
# Setting type: Boolean
# Default value: false
VerboseLogging = true

