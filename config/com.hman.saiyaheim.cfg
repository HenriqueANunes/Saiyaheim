[5 - Flight]

## Ki per second while flying. Flight should be a tool, not the default way to get around — otherwise the game's hostile terrain turns into scenery. Running out of ki in the air drops you. (Playtest value, 2026-08-13. Went 4 → 15 on 2026-07-31, because at 4 flight was cheap enough to become the default way to travel, then 15 → 10 while playing the ki attack stage, then 10 → 5: with BaseSpeed at 2 the early-game flight is slow enough to hold itself back without the ki cost doing it too.)
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 100
KiPerSecond = 5

## Ki cost multiplier while the Run button is held. (Playtest value, 2026-08-13. Was 2.5, above FastSpeedMultiplier on purpose so fast flight cost more per travelled metre; now equal to it, which makes the metre cost the same fast or slow and turns the Run button into a pure time-saver. Raise it above FastSpeedMultiplier to get the penalty back.)
# Setting type: Single
# Default value: 2
# Acceptable value range: From 1 to 10
FastKiMultiplier = 2

## Ki cost multiplier while hovering — airborne with no movement input at all, not even rising or descending. Holding position is cheaper than travelling, so stopping in the air to look around, aim or talk is not charged at the same rate as crossing the map. Set to 1 to charge the full cost regardless.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
HoverKiMultiplier = 0.5

## Flight speed floor: skill 0, battle power 0, carrying nothing. Everything else is added or multiplied on top of this. CAREFUL: the flight skill bonus MULTIPLIES this floor, so lowering it also shrinks what levelling the skill is worth — at 2, a hundred levels of Flight buy +1 m/s on a fresh character. That is intended here: almost all of the speed is meant to come from SpeedFromPower. (Playtest value, 2026-07-31. Started at 15, went to 10, landed on 2.)
# Setting type: Single
# Default value: 2
# Acceptable value range: From 1 to 100
BaseSpeed = 2

## Speed ADDED per point of raw battle power. With ki on, power is k1*HP + k4*PowerLevel — so eating better and fighting more both make you fly faster, which is the Dragon Ball reading of getting stronger. Additive, like punch damage: enemy scaling is roughly linear across biomes and an additive stat tracks that predictably. Run saiya_fly to see how much this is contributing right now.
# Setting type: Single
# Default value: 0.015
# Acceptable value range: From 0 to 1
SpeedFromPower = 0.015

## How much of a transformation's power gain turns into flight speed: the form multiplies speed by 1 + (PowerMultiplier - 1) * this. At 0.3, SSJ's x2 power is x1.3 speed and SSJ2's x3 is x1.6. Transformations are meant to be felt in combat first; letting the raw PowerMultiplier through sent flight straight into MaxSpeed, where extra power buys no actual velocity and SSJ and SSJ2 stop being distinguishable in the air. 1 restores the old behaviour (form speed = PowerMultiplier), 0 makes forms not affect flight speed at all. (Playtest value, 2026-08-21: flying transformed felt too fast while base form felt right.)
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From 0 to 1
FormSpeedShare = 0.3

## Speed multiplier while the Run button is held. Vanilla already reads that button inside its own flight code, so fast flight costs no extra keybind. (Playtest value, 2026-08-13. Raised from 1.8.)
# Setting type: Single
# Default value: 2
# Acceptable value range: From 1 to 10
FastSpeedMultiplier = 2

## Climb and dive speed, as a fraction of the horizontal speed. 1.0 goes up as fast as forward, so altitude costs no more than distance. (Playtest value, 2026-08-13. Went 0.75 → 0.5 on 2026-07-31, when climbing felt too quick; back to 1 after BaseSpeed dropped to 2 — with the horizontal speed that low, half of it made gaining altitude a crawl.)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 2
VerticalSpeedFactor = 1

## Turn speed in the air, in degrees per second. Goes straight into m_flyTurnSpeed. The vanilla value is 12, which is a flying-creature number: at 12 a 180-degree turn takes fifteen seconds, and the 2026-07-31 playtest reported exactly that. 200 turns around in about a second. Lower feels heavier and makes high speed harder to steer.
# Setting type: Single
# Default value: 200
# Acceptable value range: From 1 to 720
TurnSpeed = 200

## Speed bonus at level 100 of the flight skill. 0.5 = +50%.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 3
SpeedSkillBonus = 0.5

## Fraction of the ki cost removed at level 100 of the flight skill. 0.95 = at max level flying costs a twentieth. Together with SpeedSkillBonus this is the whole progression of the skill: farther per point of ki. KiSkillCurve decides how much of it arrives before level 100.
# Setting type: Single
# Default value: 0.95
# Acceptable value range: From 0 to 0.99
KiSkillReduction = 0.95

## Shape of the flight skill discount: reduction = KiSkillReduction * (level/100)^this. 1 is a straight line, so half the skill gives half the discount. Above 1 the saving is back-loaded — the last levels are where flight actually gets cheap, which is what keeps early flight expensive while still making level 100 feel like an arrival. Below 1 front-loads it. Check it with saiya_fly skill <level>.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0.25 to 5
KiSkillCurve = 2

## How much the late-game power term (Battle Power.K5_LateGameBonus) cheapens flight, hyperbolically: cost is multiplied by 1 / (1 + this * bonus). This is the ONLY thing the late-game term changes about flying — speed is deliberately left out of it, because speed already runs into MaxSpeed, which is a zone-streaming limit rather than balance. What being strong buys in the air is range, not velocity. Reads the late-game term alone and not total power, so early flight stays as expensive as KiPerSecond says — the reward belongs to the end of the game. 0 disables it. Check it with saiya_fly.
# Setting type: Single
# Default value: 0.0033
# Acceptable value range: From 0 to 0.1
KiPowerReduction = 0.0033

