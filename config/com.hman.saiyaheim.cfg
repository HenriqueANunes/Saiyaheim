## Settings file was created by plugin Saiyaheim v0.1.0
## Plugin GUID: com.hman.saiyaheim

[1 - General]

## Key that toggles ki on and off. Ki turned off behaves like zero ki: no damage bonus, no mastery accumulating, no ki term in the battle power.
# Setting type: KeyboardShortcut
# Default value: K
ToggleKiKey = K

## Starting ki state on a brand new character.
# Setting type: Boolean
# Default value: true
KiEnabledByDefault = true

## Key HELD DOWN to actively charge ki, far faster than passive regeneration.
# Setting type: KeyboardShortcut
# Default value: R
ChargeKiKey = R

## Key that takes off and lands. Once airborne, movement is the usual one: the game's Jump button climbs, Crouch descends and Run flies fast.
# Setting type: KeyboardShortcut
# Default value: F
ToggleFlightKey = F

## Key that transforms straight into the HIGHEST form you have unlocked, skipping everything below it. Does nothing when you are already there.
# Setting type: KeyboardShortcut
# Default value: T
TransformKey = T

## Key that goes UP one step on the ladder: base form to SSJ, SSJ to SSJ2, and so on. Use it to stop at an intermediate form instead of jumping to the top. Does nothing at the top of what you have unlocked.
# Setting type: KeyboardShortcut
# Default value: T + LeftShift
TransformStepUpKey = T + LeftShift

## Key that drops you straight back to base form, from whatever step you are on — no walking back down the ladder. Running out of ki does the same thing on its own: at zero there is nothing to hold any form with.
# Setting type: KeyboardShortcut
# Default value: G
PowerDownKey = G

## Key that goes DOWN one step, to trade power for a smaller ki drain without leaving the ladder entirely. From the first form it returns to base.
# Setting type: KeyboardShortcut
# Default value: G + LeftShift
TransformStepDownKey = G + LeftShift

## Key that fires the selected ki attack, aimed where you are looking. Needs ki turned on, enough ki for the shot, and the attack unlocked. The ki is spent on the shot, hit or miss.
# Setting type: KeyboardShortcut
# Default value: V
FireKiAttackKey = V

## Key that cycles through the ki attacks you have unlocked. With a single one unlocked it just names it on screen. The selection is not saved: every session starts on the first attack.
# Setting type: KeyboardShortcut
# Default value: V + LeftShift
CycleKiAttackKey = V + LeftShift

## Tapping the Jump button twice quickly takes off, on the ground or mid-air. It only takes OFF, never lands: Jump is what climbs while flying, so a double tap up there would fight the control you are already using. ToggleFlightKey and touching the ground are what land you.
# Setting type: Boolean
# Default value: true
TakeOffOnDoubleJump = true

## Maximum seconds between the two taps. Too high and normal jump spamming launches you by accident; too low and the double tap stops registering.
# Setting type: Single
# Default value: 0.35
# Acceptable value range: From 0.05 to 1
DoubleJumpWindow = 0.35

[2 - Ki]

## Maximum ki at level 0 of the Power Level skill. The cap grows from here — see MaxKiPerPowerLevel. With a fixed cap the bar would be the same size from the first boss to the last and progression would never show up on the HUD. (Playtest value, 2026-07-31. Still being tuned.)
# Setting type: Single
# Default value: 50
# Acceptable value range: From 10 to 10000
MaxKi = 50

## Maximum ki added per level of Power Level. With the default, level 100 quadruples the bar (100 base + 300).
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 100
MaxKiPerPowerLevel = 3

## Ki regenerated per second while idle. Deliberately low: passive regeneration is the safety net, not the normal way to get ki back. If you want ki, you charge for it. (Playtest value, 2026-08-13. Went 0.5 → 1 on 2026-08-01, when taking damage started costing ki and the safety net had to hold more; 1 → 2 once flight got cheaper and the downtime between flights was the thing being waited on.)
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 500
KiRegenPerSecond = 2

## Ki per second ADDED to the passive regeneration for each point of raw battle power. Exists because the bar grows with power (MaxKiPerPowerLevel) and a flat tap does not: without this, the stronger the character the SLOWER he fills his own bar, which is the opposite of the intent. The default keeps seconds-to-fill roughly flat across the whole game instead of making the strong player faster — the conservative half of the fix. Check it with saiya_ki, which prints seconds to fill.
# Setting type: Single
# Default value: 0.0075
# Acceptable value range: From 0 to 5
KiRegenFromPower = 0.0075

## Seconds without regenerating after spending ki. Deliberately long, together with a low KiRegenPerSecond: spending ki should hurt, and recovering it should be an action. (Calibrated in the 2026-07-28 playtest.)
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 10
KiRegenDelay = 5

## Multiplies passive ki regeneration while the player has the vanilla Rested buff (fire under shelter, or waking up in a bed). Same 1.5 the game itself uses for health and stamina regen, so the ki bar reads as one more thing Rested covers instead of a mod-only rule. Multiplicative, unlike the additive bonuses elsewhere in the mod, because it has to keep up with a tap that already grows with battle power. 1 disables it. Does NOT touch active charging: making charging faster at home would only say 'top up before leaving', which is not a decision worth having.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0.1 to 5
KiRegenRestedMultiplier = 1.5

## Multiplies KiRegenDelay while the player has the vanilla Rested buff. With the defaults, the 5s pause after spending ki becomes 3s. This is the half of the Rested bonus that actually gets noticed in combat — the multiplier on a small passive tap does not. 1 disables it; 0 removes the pause entirely while rested.
# Setting type: Single
# Default value: 0.6
# Acceptable value range: From 0 to 2
KiRegenDelayRestedMultiplier = 0.6

## Ki per second while the charge key is held. Should be much higher than KiRegenPerSecond — the point is that charging is a deliberate action worth taking, not just waiting faster. Deliberately ignores KiRegenDelay. (Playtest value, 2026-07-31. Still being tuned.)
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 500
ChargeKiPerSecond = 5

## Ki per second ADDED to active charging for each point of raw battle power. Same reason as KiRegenFromPower: with a flat 5/s, filling the bar goes from 10 seconds early on to over a minute late, because only the cap grows. The number that matters when tuning this is NOT ki per second, it is seconds-to-fill — read it off saiya_ki at a low and a high skill level.
# Setting type: Single
# Default value: 0.075
# Acceptable value range: From 0 to 5
ChargeKiFromPower = 0.075

## If true, moving interrupts charging. Charging while standing still is the classic Dragon Ball gesture and creates a real choice: stopping to charge leaves you exposed. (Both tested in the 2026-07-28 playtest; standing still won.)
# Setting type: Boolean
# Default value: true
ChargeRequiresStandingStill = true

[2.1 - Combat]

## Ki consumed per point of damage the battle power ADDED to the punch — the mirror of DamageTakenKiCost, which charges per point the ki armor absorbed. Both measure the service ki rendered, so the cost scales with the payoff instead of aging into irrelevance. The cost is therefore PunchDamageFromPower * battle power * this, and the vanilla unarmed base damage is free — ki did not provide it. Insufficient ki does NOT cancel the hit: the punch lands with raw vanilla damage, without the bonus. Missing costs nothing (the charge happens on the hit, not on the swing). Set to zero to disable the cost. (Playtest value, 2026-08-01: started at 1 to match DamageTakenKiCost and the punch was nearly free — the bar barely moved in a fight. 3 is what made the cost readable.)
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 100
PunchKiCostPerDamage = 3

## How much the combat battle power makes the three COMBAT ki costs cheaper — punching (PunchKiCostPerDamage), taking hits (DamageTakenKiCost) and blocking (BlockKiCost) — as 1 / (1 + this * combat power). 0 disables the discount and the costs stay strictly proportional to what ki delivered. Why it exists: all three costs come from the combat battle power, which has no ceiling — the late-game term grows forever and a transformation multiplies it — while the ki bar comes from the Power Level SKILL, which stops at 100. Without this, a punch eventually costs more than a full bar and lands with raw vanilla damage, and blocking drains the bar in two hits. 
## The shape matters: each cost approaches its own rate divided by this and never passes it, so actions per bar settles instead of falling to zero. For the punch at 0.01 that ceiling is 15 ki, so a full bar always buys a long fight no matter how far the battle power runs. 
## It also fixes transformations without a key of its own: a form multiplies the power, and it is the power that buys the discount, so the ratio of damage per bar between transformed and not approaches the form's PowerMultiplier instead of sitting at 1. 
## One key for all three deliberately: it is the same problem in all of them, and splitting it would invite cheap punches next to expensive blocks with no design question behind the difference. 
## Early game the power is small, so the discount is a few percent and the values calibrated on 2026-08-01 still hold there. (Playtest value, 2026-08-04. Started at 0.002, which was still tight enough that the transformed fight lived on the edge of the bar; 0.01 is what made the combat read as combat instead of bar management.)
# Setting type: Single
# Default value: 0.01
# Acceptable value range: From 0 to 1
KiCostPowerReduction = 0.01

## How much of the EXTRA combat ki cost that a transformation adds is paid back by that form's mastery. Full formula for the discount on the three combat costs: 1 / (1 + KiCostPowerReduction * combat power + (PowerMultiplier - 1) * (mastery level / 100) * this). 0 disables it and the formula is exactly what it was before this key existed. 
## 1 is the meaningful point: at mastery 100 a punch in the form costs EXACTLY what the same punch costs out of form, while still landing PowerMultiplier times the damage. Mastering a form stops it from charging extra to fight in. 
## Why it is written against the multiplier and not as a flat rate per mastery level: the premium a form charges IS its multiplier, so the payback has to scale with it. A flat rate would need 0.01 for a x2 form and 0.02 for a x3 one, and no single number could hit both. This way every rung of the ladder, including ones that do not exist yet, lands on its own base cost at mastery 100 with no retuning. 
## Above 1 the maxed form costs LESS than the base, which is the dial for the other problem: at 1 the freshly unlocked higher rung is still more ki efficient than the mastered lower one, so there is no reason to step back down. Around 2.5 the mastered SSJ overtakes a fresh SSJ2 in damage per ki and the lower rung gets a niche of its own. Which of the two targets is right is a playtest question, and this key is the whole answer to it. 
## Exact only for the punch: taking hits and blocking are charged per point the ki armor absorbed, and absorption does not scale linearly with the multiplier, so those two land near the base cost rather than on it. 
## It reads the mastery of the ACTIVE form, which starts at zero on every new rung. Out of form there is no mastery to read and only the power discount applies. 
## Note this gives mastery a SECOND payoff next to the drain reduction. It stays on the economy axis, not the power axis, so a form still never hits harder for being trained. 
## (Starting value. Not playtested yet.)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 3
MasteryFormCostReduction = 1

## Fraction of the battle power ADDED to punch damage. Additive, not multiplicative: enemy HP grows roughly linearly across biomes, and an additive stat scales predictably against that. (Playtest value, 2026-08-01. Cut to a third of the 0.15 used on 2026-07-31 — the punch was outscaling the biomes.)
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0 to 10
PunchDamageFromPower = 0.05

## Armor guaranteed while ki is on, before the share that comes from power. It exists so the player does not end up MORE fragile by turning ki on early in the game, when the skill is still at a low level. (Playtest value, 2026-07-31. Still being tuned.)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 200
ArmorBase = 1

## Fraction of the battle power converted into armor. While ki is on this armor REPLACES equipment armor — worn pieces stop counting. Turning ki off gives vanilla armor back immediately. Reads the COMBAT battle power, so it grows with K5_LateGameBonus — that is why this is much lower than it looks like it should be. (Playtest value, 2026-08-01. Lowered from 0.15 when the late-game term doubled power at level 100 and armor came along for the ride.)
# Setting type: Single
# Default value: 0.06
# Acceptable value range: From 0 to 10
ArmorFromPower = 0.06

## Fraction of the ki armor that survives when the ki bar hits ZERO (the toggle is still on, the bar is just empty). At 0 an empty bar means no armor at all, since ki armor replaces equipment armor. Raise it if running out of ki mid fight turns into an unrecoverable death. It is a cliff, not a fade: armor is at full value down to the last point of ki and only drops at zero. Deliberate — ki swings hard during a fight (punches, flight), and losing armor for ATTACKING would punish the player for something that has nothing to do with being hit.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
ArmorFractionWithoutKi = 0

## Ki consumed per point of damage the ki armor ABSORBED. Taking a hit costs ki the same way landing one does — the ki armor is sustained, not free. Damage that armor does not touch (poison, fall, drowning) absorbs nothing and therefore costs nothing. Set to zero to disable. Note the cost per hit is naturally capped near your armor value: armor can never absorb more than it is worth, so a huge hit does not drain the bar. (Playtest value, 2026-08-01. The conservative 0.15 it shipped with the same day was barely noticeable; at 1 a blocked point of damage costs a point of ki.)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 5
DamageTakenKiCost = 1

## Block power guaranteed while ki is on, before the share that comes from power. The 2 is the vanilla unarmed value, kept as a floor so turning ki on at battle power zero never makes blocking WORSE than vanilla. Same role ArmorBase plays for armor, with one difference: unlike armor, this SURVIVES an empty ki bar (ArmorFractionWithoutKi only scales the power-derived share). Zero armor is a legal value; zero block power is a division by zero inside Humanoid.BlockAttack that turns your stamina into NaN permanently. Leave this above zero.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 200
BlockPowerBase = 2

## Fraction of the battle power converted into block power. While ki is on this REPLACES the blocker item's value — holding a shield changes nothing, exactly like ArmorFromPower replaces equipment armor. Turning ki off gives the shield back immediately. Kept well BELOW the vanilla shield ladder — under the wood shield across the whole progression. It has to be: a blocked hit runs through Valheim's damage/(4*armor) curve TWICE, once against this and again against the ki armor, so what looks like a modest number compounds into near-immunity. Run 'saiya_block <damage>' to see what a given hit actually does. (Playtest value, 2026-08-23. Cut from the 0.22 of 2026-08-01, which made an endgame block absorb ~86% of a hit for 2% of the ki bar.)
# Setting type: Single
# Default value: 0.04
# Acceptable value range: From 0 to 10
BlockPowerFromPower = 0.04

## Ki consumed per point of damage the ki BLOCK stopped, measured (not estimated) from the hit before and after Humanoid.BlockAttack. Same rule as the armor: if it stopped damage, it costs ki. A failed block stops nothing and costs nothing. Unlike the punch, an empty bar does not cancel anything — the block already happened when the charge lands, so it drains what is there, like the armor does. This is the most expensive thing in the mod by design: blocking stops far more damage than armor absorbs, so it should be a beam, not a stance. Lower it if holding block for two hits empties the bar. Set to zero to make blocking free. (Starting value, 2026-08-01. Not playtested yet.)
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 5
BlockKiCost = 0.5

[3.1 - SSJ]

## Multiplies the COMBAT battle power while this form is active — punch damage, armor, block power and the number on screen all scale from it, so this one value is the whole strength of the form. Flight speed is multiplied too. The ki cap, ki regeneration and charging deliberately are NOT: a bar that grows on transforming would jump on screen, and scaled regeneration would pay for part of the form's own drain. Note the ki costs of punching and blocking scale WITH it automatically, since both are charged per point of damage dealt or absorbed. (Starting value. Not playtested yet.)
# Setting type: Single
# Default value: 2
# Acceptable value range: From 1 to 50
PowerMultiplier = 2

## Base ki drained per second while transformed, before the mastery reduction. This is the ONLY cost of the form: there is no activation cost. Hitting zero ki powers you down. Flat per second and not a fraction of the bar, because the bar already grows with Power Level (MaxKiPerPowerLevel) — so the form lasts longer as the character grows even before mastery, which is the intended reading of getting stronger. (Starting value. Not playtested yet.)
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 100
KiDrainPerSecond = 5

## Fraction of the punch's BLUNT damage turned into SLASH while this form is active. 0.5 = half and half. The total damage of the hit does not change: this moves damage between types, it does not add any. It applies to the whole punch — vanilla unarmed damage plus the Power Level bonus — and only to unarmed attacks. What it is for: armor is per damage type in Valheim, so a form that hits with two types is less punished by an enemy that resists one of them. Blunt and slash both count toward stagger, so the split does not change how fast a target staggers. (Starting value. Not playtested yet.)
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
PunchSlashFraction = 0.5

## Fraction of the punch's BLUNT damage turned into LIGHTNING while this form is active. Same rule as PunchSlashFraction above: it MOVES damage between types and adds none, so the total of the hit does not change. The two fractions split the same total. If they add up to more than 1 they are scaled down to fit, rather than eating into the blunt that is not there. Why it matters: lightning is resisted by very few things in Valheim, and the Swamp and Mountains are full of enemies weak to it — but frost caves and Fenring resist it, so it is not a free upgrade over slash. Lightning also counts toward stagger like the other physical types. (Starting value. Not playtested yet.)
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
PunchLightningFraction = 0

## Extra carry weight while this form is active. Added on top of the character's own limit (300 in vanilla) and on top of Megingjord, so 300 here would mean double the backpack while transformed. Falls off the moment the form does, and anything you were carrying over the plain limit makes you encumbered again — powering down mid-haul is the cost of using the form as a cart. Side effect worth knowing: carry load is a fraction of the LIMIT, so a bigger limit means the same cargo slows flight less and pays less Power Level XP (XpWeightBonus). Playtested 2026-08-16: started at 300 and came down to 100.
# Setting type: Single
# Default value: 100
# Acceptable value range: From 0 to 2000
CarryWeightBonus = 100

## Fraction of the drain removed at level 100 of THIS form's skill. drain = KiDrainPerSecond * (1 - level/100 * this). 1 = at level 100 the form is FREE: no drain at all, and passive ki regeneration runs again while transformed, so a maxed form is permanent until you drop it yourself. That is the intended end of the mastery curve — at first you barely hold the form, in the end you wear it. Lower it if you want the form to keep costing something forever: 0.8 means level 100 still pays a fifth of the level 0 drain, and ki stays a source of tension all game.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
MasteryDrainReduction = 1

## XP for this form's skill per second transformed. Holding the form is the only way to train it, the same way flying is the only way to train Flight. Valheim's own diminishing curve up to 100 applies on top: reaching level 30 costs about 1600 XP and level 100 about 20000. 
## (Kept at 1 after the 2026-09-06 run, deliberately. That run read SSJ mastery at level 52 with the third boss about to fall, where 80-90 was the target, and raising this key was the obvious fix — it was rejected because it speeds up the whole ladder from the first minute, including the rung the player has just unlocked, which is exactly where the slow climb is supposed to be felt. MasteryXpPerBossBonus below carries the correction instead: the deficit is on the OLD rung and only in the last stretch of play. This key sets the overall pace, that one sets the shape.)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 20
MasteryXpPerSecond = 1

## How much this form's mastery XP speeds up for each boss defeated AFTER the one that unlocked it. The multiplier is 1 + this * (bosses defeated - this form's rung), floored at 1. 0 disables it. 
## With the default 2: the form pays x1 while its own boss is the newest kill, x3 after the next boss falls, x5 after the one after that. A form unlocked at the second boss is one rung behind, so at the third boss it is still on x3 while the first form is already on x5. 
## What it is for: the mastery curve is the same for every rung, so the form unlocked first is always the one furthest up the expensive end of Valheim's XP curve, and it crawls exactly when a stronger form has just made it look useless. This makes the older rung train faster the further the world has moved past it, which is also the reading that makes sense in fiction: the form is trivial to you now. 
## It reads the world's global keys, so a server syncs it for free and someone joining late arrives with whatever the group has already killed — the same rule the unlock gate itself follows. 
## Only the five classic bosses count. A form tied to a key this build does not know, which today means the Queen and the Fader, gets no bonus at all rather than a wrong one. 
## (2 rather than 1, sized against the 2026-09-06 run: SSJ mastery was at level 52 with the third boss about to fall, where 80-90 was the target. At 2 that stretch pays the SSJ x5 instead of x3, which is what closes the gap without touching MasteryXpPerSecond. Sized on paper, not read off a run yet.)
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 5
MasteryXpPerBossBonus = 2

## Minimum Power Level required to enter this form. 0 disables the gate. This is the TRAINING gate, and it is independent of the boss gate below: with both set, the form needs both. Left at 0 for every form so far, because the ladder is paced by bosses and grinding a skill to reach a form would pace it twice.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 100
MinPowerLevel = 0

## Global key of the boss that unlocks this form. Empty disables the gate. The key belongs to the WORLD, not to the character: the server syncs it for free, it survives in the world save, and it counts for everyone in that world — so someone joining later arrives with whatever the group has already killed. That is the intended reading for a world played with friends: the ladder measures the world's progress, not each player's trophy list.
## The five valid keys, and mind that two of them are NOT named after the boss: defeated_eikthyr (Eikthyr), defeated_gdking (The Elder), defeated_bonemass (Bonemass), defeated_dragon (MODER), defeated_goblinking (YAGLUTH). A key that does not exist is not an error — it is a form that never unlocks. Check the current state with saiya_form.
# Setting type: String
# Default value: defeated_eikthyr
RequiredGlobalKey = defeated_eikthyr

