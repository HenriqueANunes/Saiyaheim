AutoLandOnGround = true

[6 - Battle Power]

## Weight of HP in the battle power. Applies to both formulas. Only HP ABOVE the game's minimum (25) counts: those 25 are handed to any new character for free, and counting them would give everyone a floor of power nobody earned. (Fixed in the 2026-07-30 playtest.)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 100
K1_Health = 1

## Weight of the equipped weapon's damage. Only used in the ki-OFF formula.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 100
K2_WeaponDamage = 2

## Weight of equipment armor. Only used in the ki-OFF formula — with ki on, armor is an output of the battle power, not an input.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0 to 100
K3_Armor = 1.5

## Weight of the Power Level skill (0-100). Only used in the ki-ON formula. It is the only axis of progression for a ki user — without it, power would be constant from the first boss to the last.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 1000
K4_PowerSkill = 3

## Power delivered by the late-game term AT LEVEL 100, on top of K4. It exists because levelling gets brutally more expensive but the reward did not: going from 99 to 100 costs a THOUSAND times what 0 to 1 costs (Valheim's curve is (level+1)^1.5), yet power rose a flat K4 every level. This term makes each level worth more than the one before it. AFFECTS COMBAT ONLY: punch damage, armor, block power and the displayed number. Flight speed and the ki cap deliberately ignore it — see Flight.KiPowerReduction for what late game buys in the air. 0 turns the term off and restores the original linear formula exactly — which is the default since the 2026-08-23 playtest, where doubling combat power at level 100 dragged punch damage, armor and block power up together.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 100
K5_LateGameBonus = 0

## How LATE the K5 term wakes up. The term is normalised on level 100, so this never changes what it delivers at the top — only how much of it arrives early. At 5, level 50 has just 3% of the bonus and level 75 has 24%: almost all of it lands in the last quarter, which is exactly the stretch that costs half the total grind. Lower spreads it out, higher concentrates it further.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 1 to 10
LateGameExponent = 5

## Weight of EFFECTIVE health — max health stretched by armor — in the scannable power rating. Applies to players and creatures alike; that shared scale is the whole point of the number, so this is deliberately NOT a per-side knob. Star variants come included for free: the game already multiplies max health by the creature level. (Playtest value, 2026-09-06. Lowered from 1 together with RatingDamageWeight going up: read side by side, bulk was drowning out offence, and a boss that only had a big health pool scanned like a boss that could actually kill you.)
# Setting type: Single
# Default value: 0.8
# Acceptable value range: From 0 to 100
RatingHealthWeight = 0.8

## How much armor DOUBLES effective health: at 50, an armor of 50 makes you count as twice your max health. This is what makes a transformation show up on the defensive side — forms grant no health, they grant armor, and without this term base form and SSJ2 read within 10% of each other. Creatures have zero armor in Valheim (only Player overrides GetBodyArmor), so their factor is exactly 1 and this key does not touch them. Lower makes armor count for more. (Playtest value, 2026-09-06. Lowered from 50 so the forms show up harder on the defensive side, which is the only side they touch.)
# Setting type: Single
# Default value: 40
# Acceptable value range: From 0 to 1000
RatingArmorScale = 40

## Weight of damage PER SECOND in the scannable power rating. Same scale for players and creatures. Per second, not per hit: a troll hits for 70 every ~4 seconds and you punch about once a second, so per-hit made the troll look stronger than a fully maxed player, which the actual fight denies. This is the knob that decides whether the number reads as offence or as bulk. (Playtest value, 2026-09-06. Raised from 1: at parity with the health weight the rating was almost pure bulk, and the number is supposed to answer 'can this thing hurt me', not 'how long does it take to chew through it'.)
# Setting type: Single
# Default value: 10
# Acceptable value range: From 0 to 100
RatingDamageWeight = 10

[6.1 - Power Level]

## XP per point of damage dealt, CAPPED at the target's remaining HP. That cap is what kills weak-mob farming: a 5000 damage punch on a 10 HP boar counts as 10. (Playtest value, 2026-08-11. Went 0.05 → 0.1 on 2026-08-01, when the early levels crawled; 0.07 is the settled middle, after 0.1 made them climb too fast.)
# Setting type: Single
# Default value: 0.07
# Acceptable value range: From 0 to 10
XpPerDamageDealt = 0.07

## XP per point of damage taken, measured AFTER armor. Measuring it after armor is what kills the exploit of taking hits on purpose from a weak enemy: taking little damage pays little. (Playtest value, 2026-08-11: kept equal to XpPerDamageDealt on purpose — the two sides of the fight should pay the same.)
# Setting type: Single
# Default value: 0.07
# Acceptable value range: From 0 to 10
XpPerDamageTaken = 0.07

## Extra XP with the inventory at maximum weight. 1.0 = doubles the gain. This is Goku's weighted clothing, and it is self-limiting: weight slows you down, eats stamina and lowers flight speed. The player pays mobility for progression.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 10
XpWeightBonus = 1

## Safety clamp: maximum XP from a single hit, dealt or taken. Prevents one hit on a boss from jumping several levels at once.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0.1 to 1000
XpMaxPerEvent = 5

[7 - HUD]

## Horizontal offset of the ki bar, in pixels. Applies live: edit the file with the game running and the bar moves.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -500 to 500
KiBarOffsetX = 0

## Vertical offset of the ki bar, in pixels, relative to the position of the native bars. Negative moves down. Applies live. Do not raise this much: at -30 the ki bar lands on top of the stamina bar. (Playtest value, 2026-07-31.)
# Setting type: Single
# Default value: -50
# Acceptable value range: From -500 to 500
KiBarOffsetY = -50

## Horizontal offset of the text, in pixels, RELATIVE to the minimap's biome label. Positive moves right. Zero puts it exactly on top of that label, so this key and the Y one below are what actually place it.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -500 to 500
PowerHudOffsetX = 0

## Vertical offset of the text, in pixels, relative to the biome label. Negative moves down. (Playtest value, 2026-09-05. The first guess was -28, one line below the label; on screen the minimap needs a lot more clearance than that. Its layout is Unity asset data and cannot be read from code, so the number could only come from looking.)
# Setting type: Single
# Default value: -200
# Acceptable value range: From -500 to 500
PowerHudOffsetY = -200

## Font size, in canvas units — the same units the game's own UI uses, so it already follows resolution and UI scale. The clone has TMP auto-sizing turned off, which is what makes this key work at all: the biome label it is cloned from recomputes its own size every layout pass and would overwrite this. (Playtest value, 2026-09-05.)
# Setting type: Single
# Default value: 20
# Acceptable value range: From 4 to 60
PowerHudFontSize = 20

## Horizontal offset of the text, in pixels, RELATIVE to the enemy's name label. Positive moves right. Zero keeps it centred like the name.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -300 to 300
EnemyPowerOffsetX = 0

## Vertical offset of the text, in pixels, relative to the enemy's name label. Negative moves down. The name sits ABOVE the health bar, so this has to clear the bar's height to land under it. (Playtest value, 2026-09-06. The -34 first guess sat a touch low; -30 tucks the number right under the bar. The hud's layout is Unity asset data and cannot be read from code, so this had to be found on screen.)
# Setting type: Single
# Default value: -30
# Acceptable value range: From -300 to 300
EnemyPowerOffsetY = -30

## Font size, in canvas units. Smaller than the player's own number on purpose: this one is drawn in the world, over the enemy, and several can be on screen at once. TMP auto-sizing is turned off on the clone, which is what makes this key work at all. (Playtest value, 2026-09-06. Raised from 14: at that size the number was unreadable at the distance you actually scan an enemy from.)
# Setting type: Single
# Default value: 16
# Acceptable value range: From 4 to 40
EnemyPowerFontSize = 16

[9 - Debug]

## Detailed logging in the BepInEx console.
# Setting type: Boolean
# Default value: false
VerboseLogging = true

