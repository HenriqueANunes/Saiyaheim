# Setting type: Single
# Default value: 50
# Acceptable value range: From 10 to 10000
MaxKi = 50

## Maximum ki added per level of Power Level. With the default, level 100 quadruples the bar (100 base + 300).
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 100
MaxKiPerPowerLevel = 3

## Ki regenerated per second while idle. Deliberately low: passive regeneration is the safety net, not the normal way to get ki back. If you want ki, you charge for it. (Playtest value, 2026-08-13. Went 0.5 → 1 on 2026-08-01, when taking damage started costing ki and the safety net had to hold more; 1 → 2 once flight got cheaper and the downtime between flights was the thing being waited on.)
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 500
KiRegenPerSecond = 2

## Ki per second ADDED to the passive regeneration for each point of raw battle power. Exists because the bar grows with power (MaxKiPerPowerLevel) and a flat tap does not: without this, the stronger the character the SLOWER he fills his own bar, which is the opposite of the intent. The default keeps seconds-to-fill roughly flat across the whole game instead of making the strong player faster — the conservative half of the fix. Check it with saiya_ki, which prints seconds to fill.
# Setting type: Single
# Default value: 0.0075
# Acceptable value range: From 0 to 5
KiRegenFromPower = 0.0075

## Seconds without regenerating after spending ki. Deliberately long, together with a low KiRegenPerSecond: spending ki should hurt, and recovering it should be an action. (Calibrated in the 2026-07-28 playtest.)
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 10
KiRegenDelay = 5

## Multiplies passive ki regeneration while the player has the vanilla Rested buff (fire under shelter, or waking up in a bed). Same 1.5 the game itself uses for health and stamina regen, so the ki bar reads as one more thing Rested covers instead of a mod-only rule. Multiplicative, unlike the additive bonuses elsewhere in the mod, because it has to keep up with a tap that already grows with battle power. 1 disables it. Does NOT touch active charging: making charging faster at home would only say 'top up before leaving', which is not a decision worth having.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0.1 to 5
KiRegenRestedMultiplier = 1.5

## Multiplies KiRegenDelay while the player has the vanilla Rested buff. With the defaults, the 5s pause after spending ki becomes 3s. This is the half of the Rested bonus that actually gets noticed in combat — the multiplier on a small passive tap does not. 1 disables it; 0 removes the pause entirely while rested.
# Setting type: Single
# Default value: 0.6
# Acceptable value range: From 0 to 2
KiRegenDelayRestedMultiplier = 0.6

## Ki per second while the charge key is held. Should be much higher than KiRegenPerSecond — the point is that charging is a deliberate action worth taking, not just waiting faster. Deliberately ignores KiRegenDelay. (Playtest value, 2026-07-31. Still being tuned.)
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 500
ChargeKiPerSecond = 5

## Ki per second ADDED to active charging for each point of raw battle power. Same reason as KiRegenFromPower: with a flat 5/s, filling the bar goes from 10 seconds early on to over a minute late, because only the cap grows. The number that matters when tuning this is NOT ki per second, it is seconds-to-fill — read it off saiya_ki at a low and a high skill level.
# Setting type: Single
# Default value: 0.075
# Acceptable value range: From 0 to 5
ChargeKiFromPower = 0.075

## If true, moving interrupts charging. Charging while standing still is the classic Dragon Ball gesture and creates a real choice: stopping to charge leaves you exposed. (Both tested in the 2026-07-28 playtest; standing still won.)
# Setting type: Boolean
# Default value: true
ChargeRequiresStandingStill = true

## Ki gained on a successful parry (a block timed right), as a fraction of your full ki bar: 0.25 refills a quarter of it. Only with ki on, and only when the parry actually stopped damage. 0 disables it.
