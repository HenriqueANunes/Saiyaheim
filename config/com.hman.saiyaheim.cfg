[2.1 - Combat]

## Ki consumed per point of damage the battle power ADDED to the punch — the mirror of DamageTakenKiCost, which charges per point the ki armor absorbed. Both measure the service ki rendered, so the cost scales with the payoff instead of aging into irrelevance. The cost is therefore PunchDamageFromPower * battle power * this, and the vanilla unarmed base damage is free — ki did not provide it. Insufficient ki does NOT cancel the hit: the punch lands with raw vanilla damage, without the bonus. Missing costs nothing (the charge happens on the hit, not on the swing). Set to zero to disable the cost. (Playtest value, 2026-08-01: started at 1 to match DamageTakenKiCost and the punch was nearly free — the bar barely moved in a fight. 3 is what made the cost readable. Raised to 7 on 2026-09-20, when the ki cost of a form moved from per second held to per punch thrown.)
# Setting type: Single
# Default value: 7
# Acceptable value range: From 0 to 100
PunchKiCostPerDamage = 7

## Same hyperbolic discount as KiCostPowerReduction, but for the two DEFENSIVE ki costs: BlockKiCost and DamageTakenKiCost. 0 (the default) means no discount at all. Why it is separate and why it is zero: those two costs are charged per point of the ENEMY's hit that ki stopped, and an enemy's hit does not grow with your power — so there is no runaway growth here for a discount to correct. Sharing the punch's discount made defending cheaper exactly as it got stronger, and transforming multiplied the effect, because the form multiplies the power that buys the discount. Playtested 2026-09-20: in SSJ3 a block stopped 3.4x more damage for the same ki. Raise it only if late-game biomes hit hard enough to make defending unpayable — that is the one question this key is here to answer.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 0.02
DefenseKiCostPowerReduction = 0

## How much of a transformation's power gain turns into EXTRA ki cost for the three combat costs — punching, blocking and taking hits: cost is multiplied by 1 + (PowerMultiplier - 1) * this * (1 - MasteryFormCostReduction * mastery/100). At 1 a form with x4 power costs 4x the ki per punch at mastery 0, which means the SAME damage per ki as base form — what the form buys there is the bigger hit, not efficiency. At the default 0.2 that same form costs 1.6x, so it already lands 2.5x the damage per ki before any mastery. Either way the surcharge is gone at mastery 100 (see MasteryFormCostReduction), where the whole multiplier becomes profit: at first you barely hold the form, in the end you wear it. Lower it to make transforming cheaper from the start; 0 gives the form's power away for free, which is how it behaved before 2026-09-20. Mirrors FormKiShare in the flight section. (Playtest value, 2026-09-21: shipped at 1 and fighting transformed drained the bar too fast; 0.5 was still too tight, and 0.2 is what made fighting in a form read as a reward instead of a bill. The base combat rates were not touched.)
# Setting type: Single
# Default value: 0.2
# Acceptable value range: From 0 to 3
CombatFormKiShare = 0.2

## How much the combat battle power makes the three COMBAT ki costs cheaper — punching (PunchKiCostPerDamage), taking hits (DamageTakenKiCost) and blocking (BlockKiCost) — as 1 / (1 + this * combat power). 0 disables the discount and the costs stay strictly proportional to what ki delivered. Why it exists: all three costs come from the combat battle power, which has no ceiling — the late-game term grows forever and a transformation multiplies it — while the ki bar comes from the Power Level SKILL, which stops at 100. Without this, a punch eventually costs more than a full bar and lands with raw vanilla damage, and blocking drains the bar in two hits. 
## The shape matters: each cost approaches its own rate divided by this and never passes it, so actions per bar settles instead of falling to zero. For the punch at 0.01 that ceiling is 15 ki, so a full bar always buys a long fight no matter how far the battle power runs. 
## It also fixes transformations without a key of its own: a form multiplies the power, and it is the power that buys the discount, so the ratio of damage per bar between transformed and not approaches the form's PowerMultiplier instead of sitting at 1. 
## One key for all three deliberately: it is the same problem in all of them, and splitting it would invite cheap punches next to expensive blocks with no design question behind the difference. 
## Early game the power is small, so the discount is a few percent and the values calibrated on 2026-08-01 still hold there. (Playtest value, 2026-08-04. Started at 0.002, which was still tight enough that the transformed fight lived on the edge of the bar; 0.01 is what made the combat read as combat instead of bar management.)
# Setting type: Single
# Default value: 0.01
# Acceptable value range: From 0 to 1
KiCostPowerReduction = 0.01

## How much of the extra ki cost that a transformation charges is paid back by that form's mastery. The form's surcharge is 1 + (PowerMultiplier - 1) * CombatFormKiShare * (1 - this * mastery/100), and it multiplies all four ki costs of fighting: punching, blocking, taking hits and ki attacks. 0 means mastery pays back nothing and the form charges its full surcharge forever. 
## 1 is the meaningful point: at mastery 100 the form costs EXACTLY what the base form costs for the same action, while still landing PowerMultiplier times the damage. Mastering a form stops it from charging extra to fight in, and that is when the multiplier becomes pure profit. 
## Why it is written against the multiplier and not as a flat rate per mastery level: the premium a form charges IS its multiplier, so the payback has to scale with it. A flat rate would need one number for a x2 form and another for a x3 one. This way every rung, including ones that do not exist yet, lands on its own base cost at mastery 100 with no retuning. 
## It reads the mastery of the ACTIVE form, which starts at zero on every new rung — so the rung you have mastered is cheaper to fight in than the one you just unlocked, which is the whole point. 
## Note this gives mastery a SECOND payoff next to the drain reduction. It stays on the economy axis, not the power axis, so a form still never hits harder for being trained. 
## (Rewritten on 2026-09-20: it used to be a term added inside the power discount's divisor, and that discount also read the form-multiplied power, so the form's premium mostly cancelled itself out — in SSJ3 a punch landed 4x the damage for 1.28x the cost. The premium is now an explicit multiplier and the power discount reads the BASE form's power.)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
MasteryFormCostReduction = 1

## Fraction of the battle power ADDED to punch damage. Additive, not multiplicative: enemy HP grows roughly linearly across biomes, and an additive stat scales predictably against that. (Playtest value, 2026-08-01. Cut to a third of the 0.15 used on 2026-07-31 — the punch was outscaling the biomes.)
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0 to 10
PunchDamageFromPower = 0.05

## Armor guaranteed while ki is on, before the share that comes from power. It exists so the player does not end up MORE fragile by turning ki on early in the game, when the skill is still at a low level. (Playtest value, 2026-07-31. Still being tuned.)
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 200
ArmorBase = 1

## Fraction of the battle power converted into armor. While ki is on this armor REPLACES equipment armor — worn pieces stop counting. Turning ki off gives vanilla armor back immediately. Reads the COMBAT battle power, so it grows with K5_LateGameBonus — that is why this is much lower than it looks like it should be. (Playtest value, 2026-08-01. Lowered from 0.15 when the late-game term doubled power at level 100 and armor came along for the ride.)
# Setting type: Single
# Default value: 0.06
# Acceptable value range: From 0 to 10
ArmorFromPower = 0.06

## Fraction of the ki armor that survives when the ki bar hits ZERO (the toggle is still on, the bar is just empty). At 0 an empty bar means no armor at all, since ki armor replaces equipment armor. Raise it if running out of ki mid fight turns into an unrecoverable death. It is a cliff, not a fade: armor is at full value down to the last point of ki and only drops at zero. Deliberate — ki swings hard during a fight (punches, flight), and losing armor for ATTACKING would punish the player for something that has nothing to do with being hit.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
ArmorFractionWithoutKi = 0

## Ki consumed per point of damage the ki armor ABSORBED. Taking a hit costs ki the same way landing one does — the ki armor is sustained, not free. Damage that armor does not touch (poison, fall, drowning) absorbs nothing and therefore costs nothing. Set to zero to disable. Note the cost per hit is naturally capped near your armor value: armor can never absorb more than it is worth, so a huge hit does not drain the bar. (Playtest value, 2026-08-01. The conservative 0.15 it shipped with the same day was barely noticeable; at 1 a blocked point of damage costs a point of ki. Raised to 1.5 on 2026-09-20, when the cost of a form moved from per second held to per action taken, and cut to 0.6 the same day, when the defensive costs stopped taking the punch's power discount — see DefenseKiCostPowerReduction.)
# Setting type: Single
# Default value: 0.6
# Acceptable value range: From 0 to 5
DamageTakenKiCost = 0.6

## Block power guaranteed while ki is on, before the share that comes from power. The 2 is the vanilla unarmed value, kept as a floor so turning ki on at battle power zero never makes blocking WORSE than vanilla. Same role ArmorBase plays for armor, with one difference: unlike armor, this SURVIVES an empty ki bar (ArmorFractionWithoutKi only scales the power-derived share). Zero armor is a legal value; zero block power is a division by zero inside Humanoid.BlockAttack that turns your stamina into NaN permanently. Leave this above zero.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 200
BlockPowerBase = 2

## Fraction of the battle power converted into block power. While ki is on this REPLACES the blocker item's value — holding a shield changes nothing, exactly like ArmorFromPower replaces equipment armor. Turning ki off gives the shield back immediately. Kept well BELOW the vanilla shield ladder — under the wood shield across the whole progression. It has to be: a blocked hit runs through Valheim's damage/(4*armor) curve TWICE, once against this and again against the ki armor, so what looks like a modest number compounds into near-immunity. Run 'saiya_block <damage>' to see what a given hit actually does. (Playtest value, 2026-08-23. Cut from the 0.22 of 2026-08-01, which made an endgame block absorb ~86% of a hit for 2% of the ki bar.)
# Setting type: Single
# Default value: 0.04
# Acceptable value range: From 0 to 10
BlockPowerFromPower = 0.04

## Ki consumed per point of damage the ki BLOCK stopped, measured (not estimated) from the hit before and after Humanoid.BlockAttack. Same rule as the armor: if it stopped damage, it costs ki. A failed block stops nothing and costs nothing. Unlike the punch, an empty bar does not cancel anything — the block already happened when the charge lands, so it drains what is there, like the armor does. This is the most expensive thing in the mod by design: blocking stops far more damage than armor absorbs, so it should be a beam, not a stance. Lower it if holding block for two hits empties the bar. Set to zero to make blocking free. (2026-08-01: 0.5. Raised to 1.2 on 2026-09-20 with the rest of the combat ki costs, then cut to 0.3 the same day: the first playtest of the rework found blocking nearly free while transformed, the defensive costs stopped taking the punch's power discount, and the rate had been inflated to compensate for it.)
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From 0 to 5
BlockKiCost = 0.3

