PowerHudOffsetY = -200

## Font size, in canvas units — the same units the game's own UI uses, so it already follows resolution and UI scale. The clone has TMP auto-sizing turned off, which is what makes this key work at all: the biome label it is cloned from recomputes its own size every layout pass and would overwrite this. (Playtest value, 2026-09-05.)
# Setting type: Single
# Default value: 20
# Acceptable value range: From 4 to 60
PowerHudFontSize = 20

## Horizontal offset of the text, in pixels, RELATIVE to the enemy's name label. Positive moves right. Zero keeps it centred like the name.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -300 to 300
EnemyPowerOffsetX = 0

## Vertical offset of the text, in pixels, relative to the enemy's name label. Negative moves down. The name sits ABOVE the health bar, so this has to clear the bar's height to land under it. (Playtest value, 2026-09-06. The -34 first guess sat a touch low; -30 tucks the number right under the bar. The hud's layout is Unity asset data and cannot be read from code, so this had to be found on screen.)
# Setting type: Single
# Default value: -30
# Acceptable value range: From -300 to 300
EnemyPowerOffsetY = -30

## Font size, in canvas units. Smaller than the player's own number on purpose: this one is drawn in the world, over the enemy, and several can be on screen at once. TMP auto-sizing is turned off on the clone, which is what makes this key work at all. (Playtest value, 2026-09-06. Raised from 14: at that size the number was unreadable at the distance you actually scan an enemy from.)
# Setting type: Single
# Default value: 16
# Acceptable value range: From 4 to 40
EnemyPowerFontSize = 16

